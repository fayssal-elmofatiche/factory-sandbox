<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The software factory</title>
<style>
/* A control-room mimic board: enamel tiles, engraved labels, lamps, breakers.
   One board for the whole talk; each slide is a camera position on it. */
:root {
  --board: #d5dcd3; --tile: #c5cdc3; --plate: #ecf0ea; --ink: #15262b; --muted: #47595b;
  --dead: #84928d; --live: #1f47c4; --ok: #128a4a; --trip: #d2281f; --warn: #d98a00; --glass: #56625f;
  --display: "DIN Alternate", "Bahnschrift", "DIN 2014", "Roboto Condensed", "Arial Narrow", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --code: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --out: cubic-bezier(.16, 1, .3, 1);
}
:root[data-theme="dark"] {
  --board: #141b1f; --tile: #1d262b; --plate: #1d262b; --ink: #e4eae4; --muted: #a3b4b1;
  --dead: #4d5c5b; --live: #7da4ff; --ok: #3fcf85; --trip: #ff6a5e; --warn: #ffbe3d; --glass: #303b3d;
}
* { box-sizing: border-box; }
html { font-size: clamp(15px, 1.22vw, 25px); }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--board); color: var(--ink); font-family: var(--body); line-height: 1.45; }
::selection { background: var(--live); color: var(--plate); }
:focus-visible { outline: 3px solid var(--live); outline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
code { font-family: var(--code); font-size: .9em; background: color-mix(in srgb, var(--ink) 9%, transparent); padding: .05em .3em; border-radius: 3px; }

/* ---- the board ---- */
#board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#board text { font-family: var(--display); fill: var(--ink); user-select: none; }
.eng { font-size: 34px; font-weight: 700; letter-spacing: .09em; text-anchor: middle; }
.eng.s { font-size: 25px; letter-spacing: .08em; }
.eng.l { text-anchor: start; }
.model { font-size: 33px; font-weight: 700; text-anchor: middle; }
.bus { stroke: var(--dead); stroke-width: 12; fill: none; stroke-linecap: round; transition: stroke .5s; }
.flow { stroke: var(--plate); stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 2 34; opacity: 0; }
.live > .bus { stroke: var(--live); }
.live > .flow { opacity: .95; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -36; } }
.ret { stroke: var(--dead); stroke-width: 6; fill: none; stroke-dasharray: 16 12; transition: stroke .4s; }
.ret.hot { stroke: var(--trip); animation: back 1s linear infinite; }
@keyframes back { to { stroke-dashoffset: -28; } }
.machine { fill: var(--plate); stroke: var(--ink); stroke-width: 8; }
.box { fill: var(--plate); stroke: var(--ink); stroke-width: 8; }
.blade { stroke: var(--ink); stroke-width: 11; stroke-linecap: round; transition: transform .55s var(--out); }
.blade.open { transform: rotate(-36deg); }
.pin { fill: var(--ink); }
.lamp { fill: var(--glass); stroke: var(--ink); stroke-width: 5; transition: fill .25s; }
.lamp.ok { fill: var(--ok); filter: drop-shadow(0 0 14px var(--ok)); }
.lamp.trip { fill: var(--trip); filter: drop-shadow(0 0 16px var(--trip)); }
.lamp.warn { fill: var(--warn); filter: drop-shadow(0 0 14px var(--warn)); }
.feeder { transition: opacity .4s; }
.off { opacity: .28; }
.fade { transition: opacity .6s; }
.hide { opacity: 0; pointer-events: none; }
.ring { fill: none; stroke-width: 10; opacity: 0; transition: opacity .3s; pointer-events: none; }
.ring.from { stroke: var(--ink); opacity: 1; stroke-dasharray: 10 14; }
.ring.legal { stroke: var(--ok); opacity: 1; }
.ring.yes { stroke: var(--ok); opacity: 1; stroke-width: 22; }
.ring.no { stroke: var(--trip); opacity: 1; stroke-width: 22; }
.tag rect { fill: var(--plate); stroke: var(--ink); stroke-width: 5; transition: fill .3s; }
.tag text { font-family: var(--code) !important; font-size: 24px; text-anchor: middle; }
.tag line { stroke: var(--ink); stroke-width: 4; }
.tag.on rect { fill: var(--live); }
.tag.on text { fill: var(--plate) !important; }
.win rect { fill: var(--glass); stroke: var(--ink); stroke-width: 6; transition: fill .25s; }
.win text { font-size: 25px; font-weight: 700; letter-spacing: .06em; text-anchor: middle; fill: #eef2ec !important; opacity: .6; }
.win.on rect { fill: var(--warn); filter: drop-shadow(0 0 18px var(--warn)); }
.win.on text { fill: #2a1c00 !important; opacity: 1; }
.win.seen rect { fill: color-mix(in srgb, var(--warn) 45%, var(--glass)); }
.win.seen text { opacity: .9; }
#packet { transition: transform .95s var(--out), opacity .3s; }
#packet rect, .amb rect { fill: var(--live); stroke: var(--plate); stroke-width: 5; }
#packet path { stroke: var(--plate); stroke-width: 5; fill: none; stroke-linecap: round; }
.loop { fill: none; stroke: var(--trip); stroke-width: 9; stroke-linecap: round; }
.tiles { fill: none; stroke: var(--tile); stroke-width: 2; }
.head-trip { fill: var(--trip); } .head-dead { fill: var(--dead); }
.station { cursor: pointer; }

/* ---- the caption plate ---- */
#panel { position: fixed; z-index: 2; background-color: var(--plate); border: 2px solid var(--ink); border-radius: 6px; padding: 1.5rem 1.7rem;
  box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--ink) 55%, transparent), 0 2px 0 color-mix(in srgb, var(--ink) 20%, transparent);
  background-image: radial-gradient(circle at 12px 12px, var(--dead) 3.2px, transparent 4px), radial-gradient(circle at calc(100% - 12px) 12px, var(--dead) 3.2px, transparent 4px),
    radial-gradient(circle at 12px calc(100% - 12px), var(--dead) 3.2px, transparent 4px), radial-gradient(circle at calc(100% - 12px) calc(100% - 12px), var(--dead) 3.2px, transparent 4px);
  max-height: calc(100vh - 6.5rem); overflow: auto; scrollbar-width: thin; scrollbar-color: var(--dead) transparent; }
#panel.left { left: 3vw; top: 50%; transform: translateY(-52%); width: min(38vw, 33rem); }
#panel.right { right: 3vw; top: 50%; transform: translateY(-52%); width: min(38vw, 33rem); }
#panel.top { left: 3vw; top: 2.2rem; width: min(72vw, 62rem); }
#panel.bottom { left: 3vw; right: 3vw; bottom: 4.6rem; }
#panel.bare { background: none; border-color: transparent; box-shadow: none; padding-left: 0; left: 5vw; top: 6vh; width: min(88vw, 74rem); overflow: visible; }
#panel.swap { animation: plate .5s var(--out); }
@keyframes plate { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: clamp(2.6rem, min(7vw, 13vh), 6rem); line-height: 1; }
h2 { font-size: clamp(1.7rem, 2.9vw, 2.9rem); line-height: 1.04; margin-bottom: .55em; }
p { margin: 0 0 .7em; max-width: 60ch; }
.sub { font-family: var(--display); font-size: clamp(1.15rem, 2vw, 1.9rem); line-height: 1.25; color: var(--muted); margin-top: .7em; max-width: 34em; }
.sub.small { font-size: 1.05rem; margin-top: 1.1em; }
.kicker { font-family: var(--display); color: var(--muted); font-size: 1.05rem; margin-bottom: .35em; }
.big { font-family: var(--display); font-size: 1.55rem; line-height: 1.15; margin: 0 0 .25em; }
.dim { color: var(--muted); }
.small { font-size: .88rem; }
dl { display: grid; grid-template-columns: auto 1fr; gap: .3em 1em; margin: .7em 0 0; }
dt { color: var(--muted); } dd { margin: 0; }
.keys { display: flex; flex-wrap: wrap; gap: .4rem; margin: .25em 0 .8em; }
.keys button { font-family: var(--display); font-size: 1.02rem; padding: .32em .75em; border-radius: 4px; border: 2px solid var(--ink); background: var(--board);
  box-shadow: 0 4px 0 var(--ink); transform: translateY(-4px); transition: transform .08s, box-shadow .08s, background .15s; }
.keys button:hover { background: color-mix(in srgb, var(--live) 14%, var(--board)); }
.keys button:active, .keys button[aria-pressed="true"] { transform: translateY(0); box-shadow: 0 0 0 var(--ink); background: var(--ink); color: var(--plate); }
.field { font-family: var(--display); color: var(--muted); margin: 0 0 .15em; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 2rem; }
.readout { border-left: 8px solid var(--dead); padding: .55em .9em; background: color-mix(in srgb, var(--ink) 6%, transparent); border-radius: 0 4px 4px 0; min-height: 4.6em; }
.readout b { font-family: var(--display); font-size: 1.3rem; display: block; }
.readout.ok { border-color: var(--ok); } .readout.ok b { color: var(--ok); }
.readout.no { border-color: var(--trip); } .readout.no b { color: var(--trip); }
.readout.warn { border-color: var(--warn); }
pre { font-family: var(--code); font-size: .8rem; line-height: 1.5; margin: 0; padding: 1em 1.2em; border-radius: 4px; background: var(--ink); color: var(--board); white-space: pre-wrap; overflow-wrap: anywhere; }
:root[data-theme="dark"] pre { background: #0b1114; color: var(--ink); }
.doc { display: grid; grid-template-columns: minmax(16rem, .8fr) 2fr; gap: 1.8rem; align-items: start; }
.doc pre { height: 15.5em; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--dead) transparent; }
.figs { display: flex; flex-wrap: wrap; gap: 1.1rem 2.6rem; margin: .5rem 0 1rem; }
.figs b { font-family: var(--display); font-size: clamp(2.4rem, 4.8vw, 4.6rem); line-height: 1; display: block; font-variant-numeric: tabular-nums; }
.figs span { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: .5rem 2rem; margin-top: .6rem; }
.legend span { display: flex; align-items: center; gap: .6em; }
.legend i { width: 1.3em; height: 1.3em; border: 3px solid var(--ink); background: var(--plate); display: inline-block; flex: none; }
.legend i.c { border-radius: 50%; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
td { padding: .32em .9em .32em 0; border-top: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); vertical-align: top; }
td.m { font-family: var(--display); font-size: 1.1rem; white-space: nowrap; }
a { color: var(--live); text-underline-offset: .18em; }

/* ---- the rail ---- */
#rail { position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 1.2rem; padding: .7rem 3vw; font-family: var(--display); font-size: .95rem;
  background: linear-gradient(to top, var(--board) 55%, transparent); }
#count { font-variant-numeric: tabular-nums; min-width: 4.5em; }
#lamps { display: flex; gap: 7px; flex: 1; }
#lamps button { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--ink); background: var(--glass); padding: 0; }
#lamps button.done { background: var(--dead); }
#lamps button.on { background: var(--live); outline: 2px solid var(--live); outline-offset: 3px; }
#rail .hint { color: var(--muted); }
#rail .go { border: 2px solid var(--ink); background: var(--plate); border-radius: 4px; padding: .25em .9em; }

@media (max-width: 820px) {
  html, body { overflow: auto; }
  #board { position: sticky; top: 0; height: 42vh; z-index: 1; }
  #panel, #panel.left, #panel.right, #panel.top, #panel.bottom, #panel.bare { position: relative; inset: auto; transform: none; width: auto; margin: .8rem .8rem 5rem; max-height: none; }
  #panel.bare { padding: 1rem; }
  .doc, .pair { grid-template-columns: 1fr; }
  #rail .hint, #lamps { display: none; }
  #rail { justify-content: space-between; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<svg id="board" role="img" aria-label="Diagram of the software factory: a line of stations from the issue queue to the main branch"></svg>
<section id="panel" aria-live="polite"></section>
<nav id="rail">
  <span id="count"></span>
  <div id="lamps"></div>
  <span class="hint">← → to move, D for dark, F for full screen</span>
  <button class="go" id="prev" aria-label="Back">Back</button>
  <button class="go" id="next" aria-label="Next">Next</button>
</nav>

<script>
const $ = (s, r = document) => r.querySelector(s)
const $$ = (s, r = document) => [...r.querySelectorAll(s)]
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches

// ====================================================================
// The board, in world units. The bus runs left to right at Y.
// ====================================================================
const Y = 1200
const X = { src: 520, intake: 1040, route: 1500, spec: 1960, build: 2440, gate: 2940, split: 3260, rev: 3560, join: 3860, approve: 4200, merge: 4660, main: 4980 }
const FEED = { code: 870, ux: 1090, ui: 1310, security: 1530 }
const FEED_NAME = { code: 'CODE', ux: 'UX', ui: 'UI DESIGN', security: 'SECURITY' }

const seg = (id, x1, x2, y = Y) => `<g class="seg" id="seg-${id}"><path class="bus" d="M${x1},${y}H${x2}"/><path class="flow" d="M${x1},${y}H${x2}"/></g>`
const eng = (x, y, t, cls = '') => `<text class="eng ${cls}" x="${x}" y="${y}">${t}</text>`
const lamp = (id, x, y, r = 15) => `<circle class="lamp" id="lamp-${id}" cx="${x}" cy="${y}" r="${r}"/>`
const machine = (id, x, y, label, model, r = 80) => `<g class="station" data-st="${id}" id="st-${id}">
  <circle class="machine" cx="${x}" cy="${y}" r="${r}"/><text class="model" x="${x}" y="${y + 12}">${model}</text>
  ${eng(x, y - r - 30, label)}${lamp(id, x + r * .78, y - r * .78)}</g>`
const breaker = (id, x, y, label) => `<g class="station" data-st="${id}" id="st-${id}">
  <rect class="box" x="${x - 60}" y="${y - 60}" width="120" height="120" rx="6"/>
  <circle class="pin" cx="${x - 40}" cy="${y}" r="9"/><circle class="pin" cx="${x + 40}" cy="${y}" r="9"/>
  <g transform="translate(${x - 40} ${y})"><line class="blade" id="blade-${id}" x1="0" y1="0" x2="80" y2="0"/></g>
  ${eng(x, y - 90, label)}${lamp(id, x + 62, y - 62)}</g>`
const ring = (id, x, y, r = 118) => `<circle class="ring" id="ring-${id}" cx="${x}" cy="${y}" r="${r}"/>`
const tag = (i, x, y, name) => `<g class="tag" id="tag-${i}"><line x1="${x}" y1="${y + 52}" x2="${x}" y2="${y + 84}"/><rect x="${x - 122}" y="${y}" width="244" height="52" rx="5"/><text x="${x}" y="${y + 34}">${name}</text></g>`

const ALARMS = ['ISSUE UNCLEAR', 'OUT OF SCOPE', 'BUILDER BLOCKED', 'ROUNDS USED UP', 'APPROVER ESCALATES', 'MERGE NOT CLEAN']
const petals = [[-135, 'WRITES'], [-45, 'TESTS'], [45, 'REVIEWS'], [135, 'APPROVES']].map(([a, t]) => {
  const p = (deg, r) => [2000 + r * Math.cos(deg * Math.PI / 180), 400 + r * Math.sin(deg * Math.PI / 180)].map(Math.round)
  const [tx, ty] = p(a, 322)
  return `<path class="loop" marker-end="url(#arrow)" d="M${p(a - 20, 128)} C${p(a - 36, 330)} ${p(a + 36, 330)} ${p(a + 20, 138)}"/>${eng(tx, ty + (a < 0 ? -6 : 30), t, 's')}`
}).join('')

$('#board').innerHTML = `
<defs>
  <pattern id="tiles" width="60" height="60" patternUnits="userSpaceOnUse"><path class="tiles" d="M60,0H0V60"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="head-trip" d="M0,0L10,5L0,10z"/></marker>
  <marker id="arrowd" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head-dead" d="M0,0L10,5L0,10z"/></marker>
  <path id="track-code" d="M${X.src},${Y}H${X.split}V${FEED.code}H${X.join}V${Y}H${X.main}"/>
  <path id="track-ui" d="M${X.src},${Y}H${X.split}V${FEED.ui}H${X.join}V${Y}H${X.main}"/>
  <path id="track-sec" d="M${X.src},${Y}H${X.split}V${FEED.security}H${X.join}V${Y}H${X.main}"/>
</defs>
<rect x="-6000" y="-6000" width="18000" height="14000" fill="url(#tiles)"/>

<g id="vignette" class="fade hide">
  ${petals}
  <circle class="machine" cx="2000" cy="400" r="124"/>
  <text class="model" x="2000" y="392">ONE</text><text class="model" x="2000" y="432">AGENT</text>
  ${[['v0', 'GRADES ITS OWN WORK'], ['v1', 'MOVES ITS OWN GOALPOSTS'], ['v2', 'LEAVES NO RECORD']].map(([id, t], i) => lamp(id, 2500, 320 + i * 80, 20) + eng(2540, 331 + i * 80, t, 's l')).join('')}
</g>

<g id="sources" class="fade hide">
  ${[['GITHUB', 1052, 344], ['FILES', 1200, 290], ['KATA', 1348, 344]].map(([t, y, tip]) =>
    `<path class="bus" d="M290,${y}H${tip}"/><rect class="box" x="70" y="${y - 40}" width="220" height="80" rx="6"/>${eng(180, y + 12, t)}`).join('')}
  <g transform="translate(${X.src} ${Y})"><line class="blade" id="srcblade" x1="0" y1="0" x2="-230" y2="0"/></g>
</g>

<path class="ret" id="ret-gate" marker-end="url(#arrowd)" d="M${X.gate},${Y + 68}V1400H${X.build + 30}V${Y + 96}"/>
<path class="ret" id="ret-review" marker-end="url(#arrowd)" d="M${X.join},1588V1640H${X.build - 30}V${Y + 96}"/>
${eng(2700, 1446, 'FAIL: THE BUILDER GETS THE LOG', 's')}
${eng(3150, 1686, 'CHANGES WANTED: THE SAME BUILDER FIXES IT', 's')}
<path class="ret" marker-end="url(#arrowd)" d="M${X.intake},${Y + 88}V1484"/>
<path class="ret" marker-end="url(#arrowd)" d="M${X.intake},1400H740V1484"/>
<path class="ret" marker-end="url(#arrowd)" d="M${X.approve},${Y + 88}V1630"/>
<g class="station" data-st="needs-info"><rect class="box" x="${X.intake - 130}" y="1495" width="260" height="76" rx="6"/>${eng(X.intake, 1543, 'NEEDS INFO', 's')}</g>
<g class="station" data-st="rejected"><rect class="box" x="610" y="1495" width="260" height="76" rx="6"/>${eng(740, 1543, 'REJECTED', 's')}</g>

${seg(0, X.src + 34, X.intake - 80)}${seg(1, X.intake + 80, X.route - 60)}${seg(2, X.route + 60, X.spec - 80)}${seg(3, X.spec + 80, X.build - 80)}
${seg(4, X.build + 80, X.gate - 60)}${seg(5, X.gate + 60, X.split - 12)}${seg(6, X.join + 12, X.approve - 80)}${seg(7, X.approve + 80, X.merge - 60)}${seg(8, X.merge + 60, X.main - 14)}

<circle class="machine" cx="${X.src}" cy="${Y}" r="34"/>${eng(X.src, Y - 66, 'ISSUES')}
${machine('intake', X.intake, Y, 'INTAKE', 'Fable')}
<g class="station" data-st="route" id="st-route"><rect class="box" x="${X.route - 60}" y="${Y - 60}" width="120" height="120" rx="6"/>
  <circle class="machine" cx="${X.route}" cy="${Y}" r="30"/><line class="blade" x1="${X.route}" y1="${Y}" x2="${X.route + 26}" y2="${Y - 15}"/>${eng(X.route, Y - 90, 'ROUTE')}${lamp('route', X.route + 62, Y - 62)}</g>
${machine('spec', X.spec, Y, 'SPEC', 'Opus')}
${machine('build', X.build, Y, 'BUILD', 'Opus')}
${breaker('gate', X.gate, Y, 'GATE')}

<g class="station" data-st="review" id="st-review">
  <rect class="box" x="${X.split - 12}" y="820" width="24" height="760" rx="4"/><rect class="box" x="${X.join - 12}" y="820" width="24" height="760" rx="4"/>
  ${eng(X.rev, 752, 'REVIEW')}
  ${Object.entries(FEED).map(([k, y]) => { const d = `M${X.split + 12},${y}H3350M3430,${y}H${X.rev - 62}M${X.rev + 62},${y}H${X.join - 12}`
    return `<g class="feeder" id="feed-${k}"><g class="seg" id="segf-${k}"><path class="bus" d="${d}"/><path class="flow" d="${d}"/></g>
    <circle class="pin" cx="3350" cy="${y}" r="9"/><circle class="pin" cx="3430" cy="${y}" r="9"/>
    <g transform="translate(3350 ${y})"><line class="blade" id="blade-${k}" x1="0" y1="0" x2="80" y2="0"/></g>
    <circle class="machine" cx="${X.rev}" cy="${y}" r="62"/><text class="model" id="model-${k}" x="${X.rev}" y="${y + 11}"></text>
    <text class="eng s l" x="${X.rev + 84}" y="${y - 24}">${FEED_NAME[k]}</text>${lamp(k, X.rev + 50, y - 50, 13)}</g>` }).join('')}
</g>

${machine('approve', X.approve, Y, 'APPROVE', 'Opus')}
${breaker('merge', X.merge, Y, 'MERGE')}
<g class="station" data-st="merged"><rect class="box" x="${X.main - 14}" y="880" width="28" height="640" rx="4"/>${eng(X.main, 846, 'MAIN')}</g>

<g id="annunciator" class="station" data-st="needs-human">
  <text class="eng l" x="3930" y="1676">NEEDS A HUMAN</text>
  ${ALARMS.map((t, i) => { const x = 3930 + (i % 3) * 320, y = 1700 + Math.floor(i / 3) * 132
    return `<g class="win" id="win-${i}"><rect x="${x}" y="${y}" width="300" height="112" rx="6"/><text x="${x + 150}" y="${y + 66}">${t}</text></g>` }).join('')}
</g>

<g id="tags" class="fade hide">
  ${[[X.src, 'issue.md', 1000], [X.intake, 'intake.md', 940], [X.spec, 'spec.md', 940], [X.build, 'build.md', 940], [X.gate, 'checks.md', 960], [X.rev, 'review-code.md', 610], [X.approve, 'decision.md', 940]]
    .map(([x, n, y], i) => tag(i, x, y, n)).join('')}
</g>

<g id="rings">

const next = () => { if (step < stepsOf(at) - 1) go(at, step + 1, false); else if (at < SLIDES.length - 1) go(at + 1) }
const prev = () => { if (step > 0) go(at, step - 1, false); else if (at > 0) go(at - 1, stepsOf(at - 1) - 1) }
function countUp(el) {
  const end = +el.dataset.n, pre = el.dataset.pre || '', dec = el.dataset.n.includes('.') ? 2 : 0, t0 = performance.now()
  const tick = (t) => { const p = Math.min(1, (t - t0) / 900), e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p); el.textContent = pre + (end * e).toFixed(dec); if (p < 1) requestAnimationFrame(tick) }
  requestAnimationFrame(tick)
}

SLIDES.forEach((s, i) => { const b = document.createElement('button'); b.title = s.name; b.setAttribute('aria-label', `Go to ${s.name}`); b.onclick = () => go(i); $('#lamps').append(b) })
$('#next').onclick = next; $('#prev').onclick = prev

// Keys on the plate, and stations on the board, drive the same state.
function act(group, v) {
  if (group === 'file') return go(at, +v, false)
  if (group === 'from') { state.from = v; state.to = null }
  else if (group === 'to') state.to = v
  else if (group === 'gate') state.gate[v] = !state.gate[v]
  else if (group === 'risk') state.risk = v
  else if (group === 'surf') state.surf.has(v) ? state.surf.delete(v) : state.surf.add(v)
  else if (group === 'tracker') state.tracker = v
  paint(false)
}
$('#panel').addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset.v) })
$('#board').addEventListener('click', (e) => {
  const st = e.target.closest('[data-st]')?.dataset.st; if (!st) return
  const name = SLIDES[at].name
  if (name === 'The interlock') { const stage = st === 'merge' ? 'merging' : st; if (STAGES.includes(stage) && stage !== state.from) act('to', stage) }
  else if (name === 'Stations' && ORDER.includes(st)) go(at, ORDER.indexOf(st), false)
})
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const onControl = e.target.closest?.('button, a, pre')
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !onControl)) { next(); e.preventDefault() }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { prev(); e.preventDefault() }
  else if (e.key === 'Home') go(0)
  else if (e.key === 'End') go(SLIDES.length - 1)
  else if (e.key === 'd' || e.key === 'D') theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark')
  else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.()
})
addEventListener('resize', () => { cam = null; fly(frameNow()) })
function theme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('factory-theme', t) } catch {} }
let saved = null; try { saved = localStorage.getItem('factory-theme') } catch {}
theme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))

const [h1, h2] = location.hash.slice(1).split('.').map((n) => parseInt(n) || 1)
go(h1 - 1, (h2 || 1) - 1, false)
</script>
