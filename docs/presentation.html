<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The software factory</title>
<style>
/* A control-room mimic board: enamel tiles, engraved labels, lamps, breakers.
   One board for the whole talk; each slide is a camera position on it. */
:root {
  --board: #d5dcd3; --tile: #c5cdc3; --plate: #ecf0ea; --ink: #15262b; --muted: #47595b;
  --dead: #84928d; --live: #1f47c4; --ok: #128a4a; --trip: #d2281f; --warn: #d98a00; --glass: #56625f;
  --display: "DIN Alternate", "Bahnschrift", "DIN 2014", "Roboto Condensed", "Arial Narrow", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --code: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --out: cubic-bezier(.16, 1, .3, 1);
}
:root[data-theme="dark"] {
  --board: #141b1f; --tile: #1d262b; --plate: #1d262b; --ink: #e4eae4; --muted: #a3b4b1;
  --dead: #4d5c5b; --live: #7da4ff; --ok: #3fcf85; --trip: #ff6a5e; --warn: #ffbe3d; --glass: #303b3d;
}
* { box-sizing: border-box; }
html { font-size: clamp(15px, 1.22vw, 25px); }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--board); color: var(--ink); font-family: var(--body); line-height: 1.45; }
::selection { background: var(--live); color: var(--plate); }
:focus-visible { outline: 3px solid var(--live); outline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
code { font-family: var(--code); font-size: .9em; background: color-mix(in srgb, var(--ink) 9%, transparent); padding: .05em .3em; border-radius: 3px; }

/* ---- the board ---- */
#board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#board text { font-family: var(--display); fill: var(--ink); user-select: none; }
.eng { font-size: 34px; font-weight: 700; letter-spacing: .09em; text-anchor: middle; }
.eng.s { font-size: 25px; letter-spacing: .08em; }
.eng.l { text-anchor: start; }
.model { font-size: 33px; font-weight: 700; text-anchor: middle; }
.bus { stroke: var(--dead); stroke-width: 12; fill: none; stroke-linecap: round; transition: stroke .5s; }
.flow { stroke: var(--plate); stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 2 34; opacity: 0; }
.live > .bus { stroke: var(--live); }
.live > .flow { opacity: .95; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -36; } }
.ret { stroke: var(--dead); stroke-width: 6; fill: none; stroke-dasharray: 16 12; transition: stroke .4s; }
.ret.hot { stroke: var(--trip); animation: back 1s linear infinite; }
@keyframes back { to { stroke-dashoffset: -28; } }
.machine { fill: var(--plate); stroke: var(--ink); stroke-width: 8; }
.box { fill: var(--plate); stroke: var(--ink); stroke-width: 8; }
.blade { stroke: var(--ink); stroke-width: 11; stroke-linecap: round; transition: transform .55s var(--out); }
.blade.open { transform: rotate(-36deg); }
.pin { fill: var(--ink); }
.lamp { fill: var(--glass); stroke: var(--ink); stroke-width: 5; transition: fill .25s; }
.lamp.ok { fill: var(--ok); filter: drop-shadow(0 0 14px var(--ok)); }
.lamp.trip { fill: var(--trip); filter: drop-shadow(0 0 16px var(--trip)); }
.lamp.warn { fill: var(--warn); filter: drop-shadow(0 0 14px var(--warn)); }
.feeder { transition: opacity .4s; }
.off { opacity: .28; }
.fade { transition: opacity .6s; }
.hide { opacity: 0; pointer-events: none; }
.ring { fill: none; stroke-width: 10; opacity: 0; transition: opacity .3s; pointer-events: none; }
.ring.from { stroke: var(--ink); opacity: 1; stroke-dasharray: 10 14; }
.ring.legal { stroke: var(--ok); opacity: 1; }
.ring.yes { stroke: var(--ok); opacity: 1; stroke-width: 22; }
.ring.no { stroke: var(--trip); opacity: 1; stroke-width: 22; }
.tag rect { fill: var(--plate); stroke: var(--ink); stroke-width: 5; transition: fill .3s; }
.tag text { font-family: var(--code) !important; font-size: 24px; text-anchor: middle; }
.tag line { stroke: var(--ink); stroke-width: 4; }
.tag.on rect { fill: var(--live); }
.tag.on text { fill: var(--plate) !important; }
.win rect { fill: var(--glass); stroke: var(--ink); stroke-width: 6; transition: fill .25s; }
.win text { font-size: 25px; font-weight: 700; letter-spacing: .06em; text-anchor: middle; fill: #eef2ec !important; opacity: .6; }
.win.on rect { fill: var(--warn); filter: drop-shadow(0 0 18px var(--warn)); }
.win.on text { fill: #2a1c00 !important; opacity: 1; }
.win.seen rect { fill: color-mix(in srgb, var(--warn) 45%, var(--glass)); }
.win.seen text { opacity: .9; }
#packet { transition: transform .95s var(--out), opacity .3s; }
#packet rect, .amb rect { fill: var(--live); stroke: var(--plate); stroke-width: 5; }
#packet path { stroke: var(--plate); stroke-width: 5; fill: none; stroke-linecap: round; }
.loop { fill: none; stroke: var(--trip); stroke-width: 9; stroke-linecap: round; }
.cmd { stroke: var(--dead); stroke-width: 6; fill: none; stroke-dasharray: 3 13; stroke-linecap: round; transition: stroke .4s; }
.cmd.on { stroke: var(--live); animation: flow 1s linear infinite; }
.desk { fill: var(--plate); stroke: var(--ink); stroke-width: 8; }
.typed { font-family: var(--code) !important; font-size: 44px; text-anchor: middle; }
.eng.desk-t { font-size: 66px; } .eng.desk-s { font-size: 34px; }
.tiles { fill: none; stroke: var(--tile); stroke-width: 2; }
.head-trip { fill: var(--trip); } .head-dead { fill: var(--dead); }
.station { cursor: pointer; }

/* ---- the caption plate ---- */
#panel { position: fixed; z-index: 2; background-color: var(--plate); border: 2px solid var(--ink); border-radius: 6px; padding: 1.5rem 1.7rem;
  box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--ink) 55%, transparent), 0 2px 0 color-mix(in srgb, var(--ink) 20%, transparent);
  background-image: radial-gradient(circle at 12px 12px, var(--dead) 3.2px, transparent 4px), radial-gradient(circle at calc(100% - 12px) 12px, var(--dead) 3.2px, transparent 4px),
    radial-gradient(circle at 12px calc(100% - 12px), var(--dead) 3.2px, transparent 4px), radial-gradient(circle at calc(100% - 12px) calc(100% - 12px), var(--dead) 3.2px, transparent 4px);
  max-height: calc(100vh - 6.5rem); overflow: auto; scrollbar-width: thin; scrollbar-color: var(--dead) transparent; }
#panel.left { left: 3vw; top: 50%; transform: translateY(-52%); width: min(38vw, 33rem); }
#panel.right { right: 3vw; top: 50%; transform: translateY(-52%); width: min(38vw, 33rem); }
#panel.top { left: 3vw; top: 2.2rem; width: min(72vw, 62rem); }
#panel.bottom { left: 3vw; right: 3vw; bottom: 4.6rem; }
#panel.wide { left: 3vw; right: 3vw; top: 2.2rem; }
#panel.bare { background: none; border-color: transparent; box-shadow: none; padding-left: 0; left: 5vw; top: 6vh; width: min(88vw, 74rem); overflow: visible; }
#panel.swap { animation: plate .5s var(--out); }
@keyframes plate { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: clamp(2.6rem, min(7vw, 13vh), 6rem); line-height: 1; }
h2 { font-size: clamp(1.7rem, 2.9vw, 2.9rem); line-height: 1.04; margin-bottom: .55em; }
p { margin: 0 0 .7em; max-width: 60ch; }
.sub { font-family: var(--display); font-size: clamp(1.15rem, 2vw, 1.9rem); line-height: 1.25; color: var(--muted); margin-top: .7em; max-width: 34em; }
.sub.small { font-size: 1.05rem; margin-top: 1.1em; }
.kicker { font-family: var(--display); color: var(--muted); font-size: 1.05rem; margin-bottom: .35em; }
.big { font-family: var(--display); font-size: 1.55rem; line-height: 1.15; margin: 0 0 .25em; }
.dim { color: var(--muted); }
.small { font-size: .88rem; }
dl { display: grid; grid-template-columns: auto 1fr; gap: .3em 1em; margin: .7em 0 0; }
dt { color: var(--muted); } dd { margin: 0; }
.keys { display: flex; flex-wrap: wrap; gap: .4rem; margin: .25em 0 .8em; }
.keys button { font-family: var(--display); font-size: 1.02rem; padding: .32em .75em; border-radius: 4px; border: 2px solid var(--ink); background: var(--board);
  box-shadow: 0 4px 0 var(--ink); transform: translateY(-4px); transition: transform .08s, box-shadow .08s, background .15s; }
.keys button:hover { background: color-mix(in srgb, var(--live) 14%, var(--board)); }
.keys button:active, .keys button[aria-pressed="true"] { transform: translateY(0); box-shadow: 0 0 0 var(--ink); background: var(--ink); color: var(--plate); }
.field { font-family: var(--display); color: var(--muted); margin: 0 0 .15em; }
.pair { display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 0 2rem; align-items: start; }
.pair .readout { margin-top: 1.4em; }
.readout { border-left: 8px solid var(--dead); padding: .55em .9em; background: color-mix(in srgb, var(--ink) 6%, transparent); border-radius: 0 4px 4px 0; min-height: 4.6em; }
.readout b { font-family: var(--display); font-size: 1.3rem; display: block; }
.readout.ok { border-color: var(--ok); } .readout.ok b { color: var(--ok); }
.readout.no { border-color: var(--trip); } .readout.no b { color: var(--trip); }
.readout.warn { border-color: var(--warn); }
pre { font-family: var(--code); font-size: .8rem; line-height: 1.5; margin: 0; padding: 1em 1.2em; border-radius: 4px; background: var(--ink); color: var(--board); white-space: pre-wrap; overflow-wrap: anywhere; }
:root[data-theme="dark"] pre { background: #0b1114; color: var(--ink); }
.doc { display: grid; grid-template-columns: 1fr 1.25fr; gap: 1.8rem; align-items: start; }
.doc pre { height: 15.5em; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--dead) transparent; }
.figs { display: flex; flex-wrap: wrap; gap: 1.1rem 2.6rem; margin: .5rem 0 1rem; }
.figs b { font-family: var(--display); font-size: clamp(2.4rem, 4.8vw, 4.6rem); line-height: 1; display: block; font-variant-numeric: tabular-nums; }
.figs span { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: .5rem 2rem; margin-top: .6rem; }
.legend span { display: flex; align-items: center; gap: .6em; }
.legend i { width: 1.3em; height: 1.3em; border: 3px solid var(--ink); background: var(--plate); display: inline-block; flex: none; }
.legend i.c { border-radius: 50%; }
.legend i.ok { background: var(--ok); } .legend i.warn { background: var(--warn); } .legend i.trip { background: var(--trip); }
ol { margin: 0 0 .8em; padding-left: 1.3em; } ol li { margin-bottom: .45em; max-width: 56ch; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
td { padding: .32em .9em .32em 0; border-top: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); vertical-align: top; }
td.m { font-family: var(--display); font-size: 1.1rem; white-space: nowrap; }
.trio { display: grid; grid-template-columns: 1fr 1.2fr 1.25fr; gap: 0 2.6rem; align-items: start; }
.trio p { margin: 0 0 .6em; } .trio p.field { margin-bottom: .35em; } .trio code { white-space: nowrap; }
a { color: var(--live); text-underline-offset: .18em; }

/* ---- the rail ---- */
#rail { position: fixed; z-index: 3; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 1.2rem; padding: .7rem 3vw; font-family: var(--display); font-size: .95rem;
  background: linear-gradient(to top, var(--board) 55%, transparent); }
#count { font-variant-numeric: tabular-nums; min-width: 17em; white-space: pre; }
#lamps { display: flex; gap: 7px; flex: 1; }
#lamps button { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--ink); background: var(--glass); padding: 0; }
#lamps button.done { background: var(--dead); }
#lamps button.on { background: var(--live); outline: 2px solid var(--live); outline-offset: 3px; }
#rail .hint { color: var(--muted); }
#rail .go { border: 2px solid var(--ink); background: var(--plate); border-radius: 4px; padding: .25em .9em; white-space: nowrap; }

@media (max-width: 820px) {
  html, body { overflow: auto; }
  #board { position: sticky; top: 0; height: 42vh; z-index: 1; }
  #panel, #panel.left, #panel.right, #panel.top, #panel.bottom, #panel.wide, #panel.bare { position: relative; inset: auto; transform: none; width: auto; margin: .8rem .8rem 5rem; max-height: none; }
  #panel.bare { padding: 1rem; }
  .doc, .pair, .trio { grid-template-columns: 1fr; }
  #rail .hint, #lamps { display: none; }
  #rail { justify-content: space-between; gap: .5rem; padding: .7rem 16px; }
  #count { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<svg id="board" role="img" aria-label="Diagram of the software factory: a line of stations from the issue queue to the main branch"></svg>
<section id="panel" aria-live="polite"></section>
<nav id="rail">
  <span id="count"></span>
  <div id="lamps"></div>
  <span class="hint">← → to move, D for dark, F for full screen</span>
  <button class="go" id="full" aria-pressed="false" hidden>Full screen</button>
  <button class="go" id="prev" aria-label="Back">Back</button>
  <button class="go" id="next" aria-label="Next">Next</button>
</nav>

<script>
const $ = (s, r = document) => r.querySelector(s)
const $$ = (s, r = document) => [...r.querySelectorAll(s)]
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches

// ====================================================================
// The board, in world units. The bus runs left to right at Y.
// ====================================================================
const Y = 1200
const X = { src: 520, intake: 1040, route: 1500, spec: 1960, build: 2440, gate: 2940, split: 3260, rev: 3560, join: 3860, approve: 4200, merge: 4660, main: 4980 }
const FEED = { code: 870, ux: 1090, ui: 1310, security: 1530 }
const FEED_NAME = { code: 'CODE', ux: 'UX', ui: 'UI DESIGN', security: 'SECURITY' }

const seg = (id, x1, x2, y = Y) => `<g class="seg" id="seg-${id}"><path class="bus" d="M${x1},${y}H${x2}"/><path class="flow" d="M${x1},${y}H${x2}"/></g>`
const eng = (x, y, t, cls = '') => `<text class="eng ${cls}" x="${x}" y="${y}">${t}</text>`
const lamp = (id, x, y, r = 15) => `<circle class="lamp" id="lamp-${id}" cx="${x}" cy="${y}" r="${r}"/>`
const machine = (id, x, y, label, model, r = 80) => `<g class="station" data-st="${id}" id="st-${id}">
  <circle class="machine" cx="${x}" cy="${y}" r="${r}"/><text class="model" x="${x}" y="${y + 12}">${model}</text>
  ${eng(x, y - r - 30, label)}${lamp(id, x + r * .78, y - r * .78)}</g>`
const breaker = (id, x, y, label) => `<g class="station" data-st="${id}" id="st-${id}">
  <rect class="box" x="${x - 60}" y="${y - 60}" width="120" height="120" rx="6"/>
  <circle class="pin" cx="${x - 40}" cy="${y}" r="9"/><circle class="pin" cx="${x + 40}" cy="${y}" r="9"/>
  <g transform="translate(${x - 40} ${y})"><line class="blade" id="blade-${id}" x1="0" y1="0" x2="80" y2="0"/></g>
  ${eng(x, y - 90, label)}${lamp(id, x + 62, y - 62)}</g>`
const ring = (id, x, y, r = 118) => `<circle class="ring" id="ring-${id}" cx="${x}" cy="${y}" r="${r}"/>`
const tag = (i, x, y, name) => `<g class="tag" id="tag-${i}"><line x1="${x}" y1="${y + 52}" x2="${x}" y2="${y + 84}"/><rect x="${x - 122}" y="${y}" width="244" height="52" rx="5"/><text x="${x}" y="${y + 34}">${name}</text></g>`

const ERAS = [['1968', 'THE IDEA'], ['1969', 'FACTORIES'], ['2004', 'REUSE'], ['2010s', 'CI/CD'], ['NOW', 'AGENTS']]
const ALARMS = ['ISSUE UNCLEAR', 'OUT OF SCOPE', 'BUILDER BLOCKED', 'ROUNDS USED UP', 'APPROVER ESCALATES', 'MERGE NOT CLEAN']
const petals = [[-135, 'WRITES'], [-45, 'TESTS'], [45, 'REVIEWS'], [135, 'APPROVES']].map(([a, t]) => {
  const p = (deg, r) => [2000 + r * Math.cos(deg * Math.PI / 180), 400 + r * Math.sin(deg * Math.PI / 180)].map(Math.round)
  const [tx, ty] = p(a, 322)
  return `<path class="loop" marker-end="url(#arrow)" d="M${p(a - 20, 128)} C${p(a - 36, 330)} ${p(a + 36, 330)} ${p(a + 20, 138)}"/>${eng(tx, ty + (a < 0 ? -6 : 30), t, 's')}`
}).join('')

$('#board').innerHTML = `
<defs>
  <pattern id="tiles" width="60" height="60" patternUnits="userSpaceOnUse"><path class="tiles" d="M60,0H0V60"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="head-trip" d="M0,0L10,5L0,10z"/></marker>
  <marker id="arrowd" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head-dead" d="M0,0L10,5L0,10z"/></marker>
  <path id="track-code" d="M${X.src},${Y}H${X.split}V${FEED.code}H${X.join}V${Y}H${X.main}"/>
  <path id="track-ui" d="M${X.src},${Y}H${X.split}V${FEED.ui}H${X.join}V${Y}H${X.main}"/>
  <path id="track-sec" d="M${X.src},${Y}H${X.split}V${FEED.security}H${X.join}V${Y}H${X.main}"/>
</defs>
<rect x="-6000" y="-6000" width="18000" height="14000" fill="url(#tiles)"/>

<g id="history" class="fade hide">
  ${ERAS.map(([when, what], i) => { const x = 1400 + i * 600
    return (i ? `<g class="seg" id="hseg-${i}"><path class="bus" d="M${x - 540},-470H${x - 60}"/><path class="flow" d="M${x - 540},-470H${x - 60}"/></g>` : '') +
      `<rect class="box" x="${x - 60}" y="-530" width="120" height="120" rx="6"/>${lamp('h' + i, x, -470, 24)}${eng(x, -570, when)}${eng(x, -350, what, 's')}` }).join('')}
</g>

<g id="orch" class="fade hide">
  <rect class="desk" x="330" y="398" width="430" height="84" rx="6"/><text class="typed" x="545" y="455">/factory run</text>
  <path class="cmd" id="cmd-you" d="M760,440H880"/>
  <rect class="desk" x="880" y="360" width="3940" height="160" rx="8"/>
  <text class="eng desk-t" x="2850" y="446">ORCHESTRATOR</text><text class="eng desk-s" x="2850" y="497">ONE CLAUDE CODE SESSION, FOLLOWING A WRITTEN PLAYBOOK</text>
  ${[['intake', X.intake, 1050, 'a'], ['route', X.route, 1076, 's'], ['spec', X.spec, 1050, 'a'], ['build', X.build, 1050, 'a'], ['gate', X.gate, 1076, 's'],
     ['review', X.rev, 712, 'a'], ['approve', X.approve, 1050, 'a'], ['merge', X.merge, 1076, 's']]
    .map(([id, x, y, kind]) => `<path class="cmd cmd-${kind}" d="M${x},520V${y}"/>`).join('')}
</g>

<g id="vignette" class="fade hide">
  ${petals}
  <circle class="machine" cx="2000" cy="400" r="124"/>
  <text class="model" x="2000" y="392">ONE</text><text class="model" x="2000" y="432">AGENT</text>
  ${[['v0', 'REVIEWS ITS OWN WORK'], ['v1', 'CHANGES ITS OWN TESTS'], ['v2', 'LEAVES NO RECORD']].map(([id, t], i) => lamp(id, 2500, 320 + i * 80, 20) + eng(2540, 331 + i * 80, t, 's l')).join('')}
</g>

<g id="sources" class="fade hide">
  ${[['YOURS', 1052, 344], ['FILES', 1200, 290], ['KATA', 1348, 344]].map(([t, y, tip]) =>
    `<path class="bus" d="M290,${y}H${tip}"/><rect class="box" x="70" y="${y - 40}" width="220" height="80" rx="6"/>${eng(180, y + 12, t)}`).join('')}
  <g transform="translate(${X.src} ${Y})"><line class="blade" id="srcblade" x1="0" y1="0" x2="-230" y2="0"/></g>
</g>

<path class="ret" id="ret-gate" marker-end="url(#arrowd)" d="M${X.gate},${Y + 68}V1400H${X.build + 30}V${Y + 96}"/>
<path class="ret" id="ret-review" marker-end="url(#arrowd)" d="M${X.join},1588V1640H${X.build - 30}V${Y + 96}"/>
${eng(2700, 1446, 'FAIL: THE BUILDER GETS THE LOG', 's')}
${eng(3150, 1686, 'CHANGES WANTED: THE SAME BUILDER FIXES IT', 's')}
<path class="ret" marker-end="url(#arrowd)" d="M${X.intake},${Y + 88}V1484"/>
<path class="ret" marker-end="url(#arrowd)" d="M${X.intake},1400H740V1484"/>
<path class="ret" marker-end="url(#arrowd)" d="M${X.approve},${Y + 88}V1630"/>
<g class="station" data-st="needs-info"><rect class="box" x="${X.intake - 130}" y="1495" width="260" height="76" rx="6"/>${eng(X.intake, 1543, 'NEEDS INFO', 's')}</g>
<g class="station" data-st="rejected"><rect class="box" x="610" y="1495" width="260" height="76" rx="6"/>${eng(740, 1543, 'REJECTED', 's')}</g>

${seg(0, X.src + 34, X.intake - 80)}${seg(1, X.intake + 80, X.route - 60)}${seg(2, X.route + 60, X.spec - 80)}${seg(3, X.spec + 80, X.build - 80)}
${seg(4, X.build + 80, X.gate - 60)}${seg(5, X.gate + 60, X.split - 12)}${seg(6, X.join + 12, X.approve - 80)}${seg(7, X.approve + 80, X.merge - 60)}${seg(8, X.merge + 60, X.main - 14)}

<circle class="machine" cx="${X.src}" cy="${Y}" r="34"/>${eng(X.src, Y - 66, 'ISSUES')}
${machine('intake', X.intake, Y, 'INTAKE', 'Fable')}

const cl = (id, name, on) => { const e = document.getElementById(id); if (e) e.classList.toggle(name, !!on) }
const lampSet = (id, state) => { const e = document.getElementById('lamp-' + id); if (e) e.setAttribute('class', 'lamp ' + (state || '')) }

const FULL = { code: 'Haiku', ux: 'Sonnet', ui: 'Haiku', security: 'Opus' }
let timers = []
const later = (fn, ms) => timers.push(setTimeout(fn, reduced ? 0 : ms))

function packet(where) {
  const p = $('#packet')
  if (!where) return p.classList.add('hide')
  const [x, y] = POS[where]
  p.classList.remove('hide'); p.style.transform = `translate(${x}px, ${y}px)`
}
const live = (n) => { for (let i = 0; i < 9; i++) cl('seg-' + i, 'live', i < n) } // segment i leads into station i
function feeders(set, energised) {
  for (const k in FEED) {
    const on = k in set
    cl('feed-' + k, 'off', !on); cl('blade-' + k, 'open', !on); cl('segf-' + k, 'live', on && energised)
    $('#model-' + k).textContent = set[k] || ''
  }
}
function resetBoard() {
  timers.forEach(clearTimeout); timers = []
  live(0); packet(null); feeders(FULL, false)
  ;['intake', 'route', 'spec', 'build', 'gate', 'approve', 'merge', 'code', 'ux', 'ui', 'security', 'v0', 'v1', 'v2'].forEach((l) => lampSet(l, ''))
  ;['gate', 'merge'].forEach((b) => cl('blade-' + b, 'open', false))
  $$('.ring').forEach((r) => r.setAttribute('class', 'ring')); $$('.win').forEach((w) => w.setAttribute('class', 'win')); $$('.tag').forEach((t) => t.classList.remove('on'))
  ;['ret-gate', 'ret-review'].forEach((r) => cl(r, 'hot', false))
  ;['vignette', 'sources', 'tags', 'ambient', 'history', 'orch'].forEach((g) => cl(g, 'hide', true))
  $$('.cmd').forEach((c) => c.classList.remove('on'))
  ERAS.forEach((_, i) => { lampSet('h' + i, ''); cl('hseg-' + i, 'live', false) })
  $('#srcblade').style.transform = 'rotate(0deg)'
}
// The job reaches station k (8 = merged): everything behind it is energised and lit.
function reach(k, set) {
  live(k + 1); feeders(set, k >= 5)
  ORDER.forEach((s, i) => { if (s !== 'review') lampSet(s, i < k ? 'ok' : i === k ? 'warn' : '') })
  for (const f in FEED) lampSet(f, f in set ? (k > 5 ? 'ok' : k === 5 ? 'warn' : '') : '')
  packet(k < 8 ? ORDER[k] : 'main')
}
const runLine = (set, pace = 620) => { for (let k = 0; k <= 8; k++) later(() => reach(k, set), 350 + k * pace) }

let cam = null, camAnim = 0
function frameFor([cx, cy, w], side) {
  const narrow = innerWidth <= 820
  const W = innerWidth, H = narrow ? innerHeight * .42 : innerHeight
  const h = w * H / W
  const fx = narrow ? .5 : side === 'left' ? .7 : side === 'right' ? .3 : .5
  const fy = narrow ? .5 : side === 'top' || side === 'wide' ? .66 : side === 'bare' ? .7 : side === 'bottom' ? .27 : .5
  return [cx - fx * w, cy - fy * h, w, h]
}
function fly(to, ms = 1100) {
  cancelAnimationFrame(camAnim)
  const from = cam, t0 = performance.now()
  if (reduced || !from) { cam = to; return $('#board').setAttribute('viewBox', to.join(' ')) }
  const tick = (t) => {
    const p = Math.min(1, (t - t0) / ms), e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p)
    cam = from.map((v, i) => v + (to[i] - v) * e)
    $('#board').setAttribute('viewBox', cam.map((v) => v.toFixed(1)).join(' '))
    if (p < 1) camAnim = requestAnimationFrame(tick)
  }
  camAnim = requestAnimationFrame(tick)
}

      <p class="dim">These are the files of one job, retold for this repo's power-auction app from the first job the factory ran. Each station reads the earlier ones and writes one of its own.</p>${keys('file', FILES.map(([n], i) => [i, n]), (v) => +v === s)}
      <p><b>Notice:</b> ${NOTICE[s]}</p></div><pre tabindex="0">${FILES[s][1].replace(/</g, '&lt;')}</pre></div>`,
    board: (s) => { cl('tags', 'hide', false); cl('tag-' + s, 'on', true); live(9); feeders({ code: 'Haiku' }, true) } },

  { name: 'The rules', side: 'wide', frame: [2760, 1130, 5600],
    html: () => { const why = legalMove()
      return `<h2>A script tracks where each job is and refuses illegal moves</h2>
      <p>No agent can move a job to the next station. The orchestrator asks the script, and the script moves the job only when the right file is there.</p>

      <div class="readout ${!state.to ? '' : why ? 'ok' : 'no'}">${!state.to ? '<b>Pick a destination</b>The green rings mark the legal moves. Any other choice is refused.'
        : why ? `<b>Allowed, on one condition</b>Only if ${why}` : `<b>Refused</b><code>job: 001: ${state.from} → ${state.to} is not a legal transition</code>`}</div></div>` },
    board: () => { cl('ring-' + state.from, 'from', true)
      STAGES.forEach((s) => { if (MOVES[`${state.from}>${s}`]) cl('ring-' + s, 'legal', true) })
      if (state.to) { $('#ring-' + state.to).setAttribute('class', 'ring ' + (legalMove() ? 'yes' : 'no')) } } },

  { name: 'The gate', side: 'left', frame: [2700, 1250, 1750],
    html: () => { const g = state.gate
      const [c, t, d] = g.checks ? ['no', 'Blocked', 'A protected file changed. The edit also had no effect, because the gate runs the copy of the checks from main.']
        : g.fail ? ['no', 'Blocked', 'The checks fail. The builder gets the log, and no reviewer is started.']
        : g.weak ? ['warn', 'Passed. The gate cannot catch this', 'A script cannot tell an honest test change from a weakened one, so the code reviewer is told to look for it.']
        : ['ok', 'Passed', 'The checks pass and no protected file changed. Reviewers start.']
      return `<h2>New code cannot change the checks it is judged by</h2><p>The gate takes the checks from the main version, so the builder cannot switch them off.</p><p class="field">Try it. The builder</p>
      ${keys('gate', [['fail', 'breaks a test'], ['checks', 'edits checks.sh'], ['weak', 'weakens a test']], (v) => g[v])}<div class="readout ${c}"><b>${t}</b>${d}</div>` },
    board: () => { const g = state.gate, trip = g.checks || g.fail
      live(trip ? 5 : 6); feeders({ code: 'Haiku' }, !trip); lampSet('build', 'ok'); packet(trip ? 'build' : 'review')
      cl('blade-gate', 'open', trip); lampSet('gate', trip ? 'trip' : 'ok'); cl('ret-gate', 'hot', trip); lampSet('code', !trip && g.weak ? 'warn' : '') } },

  { name: 'Routing', side: 'left', frame: [3640, 1200, 1900],
    html: () => { const sec = state.surf.has('security') || state.risk === 'high'
      const n = 1 + (state.surf.has('ui') ? 2 : 0) + (sec ? 1 : 0)
      return `<h2>Risk decides who reviews</h2><p class="field">Intake rated the risk</p>${keys('risk', [['low'], ['medium'], ['high']], (v) => v === state.risk)}
      <p class="field">The change touches</p>${keys('surf', [['ui', 'the interface'], ['security', 'security or personal data']], (v) => state.surf.has(v))}
      <div class="readout ok"><b>${n} reviewer${n > 1 ? 's' : ''}${n > 1 ? ', in parallel' : ''}</b>${n === 1 ? (state.risk === 'low' ? 'A low-risk change gets one reviewer on the cheapest model.' : 'A medium-risk change still gets one reviewer, on a stronger model.') : (state.risk === 'high' ? (state.surf.has('security') ? '' : 'High risk always adds the security reviewer. ') + 'And a person merges it, whatever the approver says. ' : '') + 'The job waits for all of them. A table in config.json decides who runs.'}</div>
      <p class="dim small" style="margin-top:.8em">Haiku is the smallest and cheapest Claude model, Sonnet is mid-sized and Opus is the largest.</p>` },
    board: () => { const set = { code: state.risk === 'low' ? 'Haiku' : 'Sonnet' }
      if (state.surf.has('ui')) { set.ux = 'Sonnet'; set.ui = 'Haiku' }
      if (state.surf.has('security') || state.risk === 'high') set.security = 'Opus'
      live(6); feeders(set, true); packet('review'); lampSet('gate', 'ok'); for (const k in set) lampSet(k, 'warn') } },

  { name: 'The human', side: 'left', frame: [4390, 1640, 1700], steps: 6,
    html: (s) => `<p class="kicker">Alarm ${s + 1} of 6</p><h2>It stops when a person should decide</h2><p class="big">${ALARM_TEXT[s][0]}</p><p>${ALARM_TEXT[s][1]}</p>
      <p class="dim small">You can merge it yourself, send it back with feedback, or reject it. The factory never deploys.</p>`,
    board: (s) => { live(7); feeders({ code: 'Haiku' }, true); for (let i = 0; i < s; i++) cl('win-' + i, 'seen', true); cl('win-' + s, 'on', true); lampSet('approve', 'warn') } },

  { name: 'A real run', side: 'top', frame: [2760, 1330, 5500], steps: 2,
    html: (s) => s === 0 ? `<h2>The first job, as it ran</h2><div class="figs">
        <div><b data-n="63">63</b><span>lines added</span></div><div><b data-n="8">8</b><span>new tests</span></div><div><b data-n="1">1</b><span>reviewer</span></div>
        <div><b data-n="2">2</b><span>check runs</span></div><div><b data-n="1.11" data-pre="$">$1.11</b><span>AI usage cost</span></div></div>
        <p class="dim small">On the toy app this repo started with, before the power auction.</p><p>Intake settled two open cases the way the existing code already behaved, and wrote down how to overrule it. The approver ran the tests again before merging.</p>`
      : `<h2>It also stalled once, and that was correct</h2><p class="big">The routing script had no price for a new model.</p>
        <p>It refused to continue until a price was added to <code>config.json</code>. No job runs on a model whose cost the factory cannot count.</p>`,
    board: (s) => { if (s === 0) runLine({ code: 'Haiku' }, 330); else { live(2); feeders({}, false); packet('route'); lampSet('intake', 'ok'); lampSet('route', 'trip') } } },

  { name: 'On your machine', side: 'right', frame: [400, 1200, 1500],
    html: () => { const T = TRACKERS[state.tracker]
      return `<h2>Everything runs on your machine</h2><p class="field">Issues come from</p>${keys('tracker', [['yours'], ['files'], ['kata']], (v) => v === state.tracker)}
      <p class="big">${T[0]}</p><p>${T[1]} You need ${T[2]}.</p><p class="dim small">Another tracker, such as GitLab, would connect at this same point.</p>
      <p class="dim small">The factory merges the branch into main itself once the gate has passed again, in a repository on disk next to your checkout. Git refuses the push if main moved in the meantime.</p>` },
    board: () => { cl('sources', 'hide', false); live(1); $('#srcblade').style.transform = `rotate(${TRACKERS[state.tracker][3]}deg)` } },

  { name: 'The commands', side: 'wide', frame: [2760, 1130, 5600],
    html: () => { const row = (cmd, what) => `<p><code>${cmd}</code><br>${what}</p>`
      return `<h2>One command drives it: fx</h2><div class="trio">
      <div><p class="field">Get ready</p>
        ${row('./fx doctor', 'checks that this machine can run the factory')}
        ${row('./fx up', 'starts the dashboard and opens it')}</div>
      <div><p class="field">Run</p>
        ${row('./fx queue 2', 'queues request 2 for the next run')}
        ${row('./fx run', 'opens Claude Code and types <code>/factory run</code>')}
        ${row('./fx status', 'shows the jobs and what runs next')}
        ${row('./fx watch', 'shows the files as the stations write them')}</div>
      <div><p class="field">Experiment</p>
        ${row('./fx config review.low sonnet', 'changes one setting')}
        ${row('./fx reset', 'discards the work, keeps your setup, starts again')}
        <p class="dim small" style="margin-top:1em"><code>./fx &lt;command&gt; --help</code> explains each one. The factory still runs in a Claude Code session that you watch; <code>fx</code> only opens it.</p></div>
      </div>` },
    board: () => { cl('ambient', 'hide', false); live(9); feeders({ code: 'Haiku', ui: 'Haiku', security: 'Opus' }, true) } },

  { name: 'In short', side: 'left', frame: [3100, 1250, 6800],
    html: () => `<h2>Five ideas to take away</h2><ol>
      <li>Split the work into stations that each do one thing.</li>
      <li>Hand over files, so every step leaves a record.</li>
      <li>Let scripts decide what may pass. Agents do the work, and one orchestrator session only coordinates.</li>
      <li>Spend more review where the risk is higher.</li>
      <li>Stop and ask a person when a decision is theirs to make.</li></ol>`,
    board: () => { cl('ambient', 'hide', false); live(9); feeders({ code: 'Haiku', ui: 'Haiku', security: 'Opus' }, true) } },

  { name: 'Try it', side: 'left', frame: [3100, 1250, 6800],
    html: () => `<h2>Run it on your own machine</h2><pre>git clone https://github.com/fayssal-elmofatiche/factory-sandbox.git
cd factory-sandbox
./fx doctor     # is this machine ready?
./fx deck       # this presentation
./fx up         # the dashboard
./fx run        # sets it up the first time, then Claude Code on /factory run</pre>
      <p style="margin-top:.9em">Six issues are waiting. Some should merge, some should be escalated to you, one needs an answer from you first, and one should be rejected. Guess which before you run them.</p>
      <p class="dim small">macOS, Linux, or Windows (natively with <code>.\\fx.cmd</code>, or in WSL). The factory is <a href="https://github.com/zazencodes/zazencodes-season-3/tree/main/src/software-factory-claude-code-v2">ZazenCodes' Software Factory v2</a>, GPLv3. This repository adapts it and runs it entirely on your machine.</p>`,
    board: () => { cl('ambient', 'hide', false); live(9); feeders({ code: 'Haiku', ui: 'Haiku', security: 'Opus' }, true) } },
]

// ====================================================================
// Deck
// ====================================================================
let at = 0, step = 0
const stepsOf = (i) => SLIDES[i].steps || 1
function paint(swap) {
  const s = SLIDES[at], panel = $('#panel'), a = document.activeElement, focus = a?.dataset?.act && [a.dataset.act, a.dataset.v]
  panel.className = s.side
  if (swap) { void panel.offsetWidth; panel.classList.add('swap'); panel.scrollTop = 0 }
  panel.innerHTML = s.html(step)
  if (focus) $(`[data-act="${focus[0]}"][data-v="${focus[1]}"]`, panel)?.focus()
  resetBoard(); s.board?.(step)
  $('#count').textContent = `${String(at + 1).padStart(2, '0')} / ${SLIDES.length}  ${s.name}${stepsOf(at) > 1 ? `, step ${step + 1} of ${stepsOf(at)}` : ''}`
  $$('#lamps button').forEach((b, i) => b.className = i === at ? 'on' : i < at ? 'done' : '')
  history.replaceState(null, '', `#${at + 1}${step ? '.' + (step + 1) : ''}`)
  document.title = `${s.name}: the software factory`
}
const frameNow = () => { const f = SLIDES[at].frame; return frameFor(typeof f === 'function' ? f(step) : f, SLIDES[at].side) }
function go(i, st = 0, swap = true) {
  at = Math.max(0, Math.min(SLIDES.length - 1, i)); step = Math.max(0, Math.min(stepsOf(at) - 1, st))
  fly(frameNow()); paint(swap)
  if (swap && !reduced) $$('.figs b').forEach(countUp)
}
const next = () => { if (step < stepsOf(at) - 1) go(at, step + 1, false); else if (at < SLIDES.length - 1) go(at + 1) }
const prev = () => { if (step > 0) go(at, step - 1, false); else if (at > 0) go(at - 1, stepsOf(at - 1) - 1) }
function countUp(el) {
  const end = +el.dataset.n, pre = el.dataset.pre || '', dec = el.dataset.n.includes('.') ? 2 : 0, t0 = performance.now()
  const tick = (t) => { const p = Math.min(1, (t - t0) / 900), e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p); el.textContent = pre + (end * e).toFixed(dec); if (p < 1) requestAnimationFrame(tick) }
  requestAnimationFrame(tick)
}

SLIDES.forEach((s, i) => { const b = document.createElement('button'); b.title = s.name; b.setAttribute('aria-label', `Go to ${s.name}`); b.onclick = () => go(i); $('#lamps').append(b) })
$('#next').onclick = next; $('#prev').onclick = prev
function fullScreen() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.() }
$('#full').hidden = !document.fullscreenEnabled  // phones and embedded views that can't go full screen get no button
$('#full').onclick = (e) => { fullScreen(); e.currentTarget.blur() }
addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement
  $('#full').textContent = on ? 'Exit full screen' : 'Full screen'
  $('#full').setAttribute('aria-pressed', on)
})

// Keys on the plate, and stations on the board, drive the same state.
function act(group, v) {
  if (group === 'file') return go(at, +v, false)
  if (group === 'from') { state.from = v; state.to = null }
  else if (group === 'to') state.to = v
  else if (group === 'gate') state.gate[v] = !state.gate[v]
  else if (group === 'risk') state.risk = v
  else if (group === 'surf') state.surf.has(v) ? state.surf.delete(v) : state.surf.add(v)
  else if (group === 'tracker') state.tracker = v
  paint(false)
}
$('#panel').addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act, b.dataset.v) })
$('#board').addEventListener('click', (e) => {
  const st = e.target.closest('[data-st]')?.dataset.st; if (!st) return
  const name = SLIDES[at].name
  if (name === 'The rules') { const stage = st === 'merge' ? 'merging' : st; if (STAGES.includes(stage) && stage !== state.from) act('to', stage) }
  else if (name === 'Stations' && ORDER.includes(st)) go(at, ORDER.indexOf(st), false)
})
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return
  const onControl = e.target.closest?.('button, a, pre')
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || (e.key === ' ' && !onControl)) { next(); e.preventDefault() }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { prev(); e.preventDefault() }
  else if (e.key === 'Home') go(0)
  else if (e.key === 'End') go(SLIDES.length - 1)
  else if (e.key === 'd' || e.key === 'D') theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark')
  else if (e.key === 'f' || e.key === 'F') fullScreen()
})
addEventListener('resize', () => { cam = null; fly(frameNow()) })
function theme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('factory-theme', t) } catch {} }
let saved = null; try { saved = localStorage.getItem('factory-theme') } catch {}
theme(saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'))

const [h1, h2] = location.hash.slice(1).split('.').map((n) => parseInt(n) || 1)
go(h1 - 1, (h2 || 1) - 1, false)
</script>
