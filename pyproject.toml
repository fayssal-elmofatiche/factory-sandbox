[project]
name = "evently"
version = "0.1.0"
description = "A small event-registration app used to demo a software factory"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".worktrees", "factory/jobs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP"]
