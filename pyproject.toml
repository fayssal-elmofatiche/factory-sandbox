[project]
name = "dayahead"
version = "0.1.0"
description = "A small day-ahead power auction used to demo a software factory"
requires-python = ">=3.10"
license = "GPL-3.0-only"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".worktrees", "factory/jobs"]
# The factory's scripts have no .py suffix; lint them too.
extend-include = ["factory/bin/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
# Upstream writes long message lines; keep the diff against it small.
"factory/bin/*" = ["E501"]
