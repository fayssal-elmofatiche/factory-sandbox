<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root {
    --bg: #14151b;
    --panel: #1a1c24;
    --card: #20222c;
    --card-hover: #252835;
    --line: #2b2e3b;
    --text: #e4e5ea;
    --muted: #868ba0;
    --faint: #5b6075;
    --active: #8be9fd;
    --pass: #50fa7b;
    --changes: #ffb86c;
    --human: #ff5555;
    --merged: #bd93f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* Header */
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; padding: 28px 32px 8px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--pass); margin-right: 6px; vertical-align: 1px;
  }
  .status.error { color: var(--human); }
  .status.error .dot { background: var(--human); }
  .banner {
    margin: 12px 32px 0; padding: 10px 14px; border: 1px solid var(--human);
    border-radius: 8px; color: var(--human); font-family: var(--mono); font-size: 12px;
  }

  /* Jobs that wait on a person, above everything else. */
  .needs {
    margin: 14px 32px 0; padding: 12px 16px; border: 1px solid var(--human); border-radius: 10px;
    background: color-mix(in srgb, var(--human) 7%, var(--card));
  }
  .needs[hidden] { display: none; }
  .needs h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; color: var(--human); }
  .needs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .needs li { display: grid; grid-template-columns: minmax(0, 18em) minmax(0, 1fr); gap: 6px 16px; align-items: start; }
  .needs .job {
    text-align: left; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--text);
  }
  .needs .job .num { display: block; }
  .needs .job:hover .t { text-decoration: underline; }
  .needs .job:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; border-radius: 4px; }
  .needs .move { margin: 0; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Board */
  .board {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px;
    padding: 20px 32px 40px; align-items: start;
  }
  .col { min-width: 0; }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 0 2px 10px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px; position: relative;
  }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .col-head .who { font-size: 11px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .count {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .col:not(:last-child):not(:nth-last-child(2)) .col-head::after {
    content: "›"; position: absolute; right: -10px; top: -2px; color: var(--faint); font-size: 16px;
  }
  .col.human .col-head { border-bottom-color: color-mix(in srgb, var(--human) 55%, transparent); }
  .col.human h2 { color: var(--human); }
  .col.merged-col h2 { color: var(--merged); }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }

  /* Cards */
  .card {
    display: block; width: 100%; text-align: left; cursor: pointer; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 12px 10px; margin-bottom: 10px;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .card.live { border-color: color-mix(in srgb, var(--active) 35%, var(--line)); }
  .card.human {
    border-color: var(--human);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent),
                0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent);
  }
  .card.done { opacity: .72; }
  .card.rejected .feature { text-decoration: line-through; text-decoration-color: var(--faint); }
  .flag.wait { color: var(--changes); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .card-top .num { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--active);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .flag {
    margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--human); white-space: nowrap;
  }
  .feature { font-size: 13px; line-height: 1.4; margin: 0 0 6px; }
  .links { display: flex; gap: 10px; font-family: var(--mono); font-size: 11px; }
  .links a { color: var(--active); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .meta { display: flex; gap: 10px; margin-top: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .meta .risk-high { color: var(--human); } .meta .risk-medium { color: var(--changes); }
  .chip.FAIL { border: 1px solid transparent; color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .branch {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rounds { margin-top: 10px; display: grid; gap: 5px; }
  .round { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 4px; align-items: start; }
  .round .r { font-family: var(--mono); font-size: 10px; color: var(--faint); padding-top: 4px; }
  /* Chips sit in equal columns and wrap in step, so a job with four reviewers stays tidy. */
  .round .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; }
  .chip {
    display: flex; flex-direction: column; justify-content: center;
    text-align: center; font-family: var(--mono); font-size: 10px; line-height: 1.25;
    padding: 2px 4px; border-radius: 4px; border: 1px dashed var(--faint); color: var(--faint);
  }
  /* The model a reviewer runs on, under its name. */
  .chip small { font-size: 9px; opacity: .72; }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; }
  .chip.PASS {
    border: 1px solid transparent; color: var(--pass);
    background: color-mix(in srgb, var(--pass) 14%, transparent);
  }
  .chip.CHANGES {
    border: 1px solid transparent; color: var(--changes);
    background: color-mix(in srgb, var(--changes) 16%, transparent);
  }
  .chip.bad { border: 1px solid var(--human); color: var(--human); }
  .hint {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.6;
    overflow-wrap: anywhere;
  }
  /* What a person can do with a waiting job: one command per line, each with a copy button. */
  .moves { margin: 12px 0 0; display: grid; gap: 6px; }
  .moves[hidden] { display: none; }
  .moves .why { font-size: 12px; color: var(--muted); }
  .move { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .move code {
    font-family: var(--mono); font-size: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; overflow-x: auto; white-space: nowrap; user-select: all;
  }
  .move .what { grid-column: 1 / -1; font-size: 11.5px; color: var(--faint); margin-top: -2px; }
  .copy {
    font-family: var(--mono); font-size: 11px; color: var(--muted); background: none; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; min-width: 58px;
  }
  .copy:hover { color: var(--text); border-color: var(--muted); }
  .copy:focus-visible { outline: 2px solid var(--active); outline-offset: 1px; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip.wait { animation: none; } }

  /* Drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(5, 6, 10, .55);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(100%);
    transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head .num { font-size: 12px; }
  .d-head h3 { margin: 4px 40px 6px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
    border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .d-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  .files .group {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); margin: 12px 8px 4px;
  }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .file:hover { background: var(--card); color: var(--text); }
  .file.on { background: var(--card-hover); color: var(--text); }
  .file .rn { display: none; }
  .file .v { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .v.good { background: var(--pass); } .v.warn { background: var(--changes); } .v.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 680px; line-height: 1.65; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code {
    font-family: var(--mono); font-size: 12px; background: var(--card);
    padding: 1px 5px; border-radius: 4px;
  }
  .md pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md a { color: var(--active); }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; margin-bottom: 14px;
  }
  .verdict + * { margin-top: .4em; }
  .md .head { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: -6px 0 14px; white-space: pre-line; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .note { color: var(--faint); font-size: 13px; }
  .md .summary {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 16px 4px; margin: 0 0 22px;
  }
  .md .summary h2 {
    margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted);
  }
  .md .summary ul { margin: 0 0 .6em; }

  footer {
    padding: 0 32px 32px; font-family: var(--mono); font-size: 11px; color: var(--faint);
    display: flex; gap: 20px; flex-wrap: wrap;
  }

  /* The factory as a whole: counts and totals over every job on the board. */
  .totals {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 28px;
    margin: 14px 32px 0; padding: 14px 18px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card);
  }
  .totals:empty { display: none; }
  .stat .k { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .stat b { display: block; font-size: 22px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .stat .d { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .totals .row {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 18px; padding-top: 10px;
    border-top: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .totals .row .k { color: var(--faint); }
  .totals .row b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 28px; }
    .col-head::after { display: none; }
  }
  @media (max-width: 640px) {
    header { padding: 20px 16px 4px; }
    .banner { margin: 12px 16px 0; }
    .needs { margin: 12px 16px 0; }
    .needs li { grid-template-columns: 1fr; }
    .totals { margin: 12px 16px 0; }
    .board { grid-template-columns: 1fr; padding: 16px 16px 32px; }
    footer { padding: 0 16px 24px; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files {
      border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px;
      overflow-x: auto; padding: 8px;
    }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
  }
</style>
</head>
<body>
<header>
  <h1>Software factory</h1>
  <div class="status" id="status">connecting…</div>
</header>
<div id="banner"></div>
<section class="needs" id="needs" aria-labelledby="needs-title" hidden></section>
<div class="sr-only" id="announce" aria-live="polite"></div>
<section class="totals" id="summary" aria-label="Factory totals"></section>
<main class="board" id="board"></main>
<footer>
  <span>/factory run</span>
  <span>/factory run &lt;n&gt;</span>
  <span>/factory &lt;anything&gt;</span>
  <span id="totals"></span>
</footer>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="num" id="d-num"></div>
      <h3 id="d-title"></h3>
      <div class="links" id="d-links"></div>
      <div class="moves" id="d-moves" hidden></div>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body">
      <nav class="files" id="d-files"></nav>
      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>
  </aside>
</div>

<script>
const POLL_MS = 2000
const COLUMNS = [
  { label: 'Intake', who: 'intake · fable', stages: ['intake', 'needs-info'] },
  { label: 'Spec', who: 'spec-writer · opus', stages: ['spec'] },
  { label: 'Build', who: 'builder · gate', stages: ['build', 'gate'] },
  { label: 'Review', who: 'routed reviewers', stages: ['review'] },
  { label: 'Approve', who: 'approver · merge', stages: ['approve', 'merging'] },
  { label: 'Needs human', who: 'you', stages: ['needs-human'], cls: 'human' },
  { label: 'Done', who: 'merged · rejected', stages: ['merged', 'rejected'], cls: 'merged-col' },
]
const STAGES = new Set(COLUMNS.flatMap((c) => c.stages))
const LIVE = new Set(['intake', 'spec', 'build', 'gate', 'review', 'approve', 'merging'])
const SHORT = { code: 'code', ux: 'ux', ui: 'ui', security: 'sec' }

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

let jobs = []
let lastRender = ''
const roundCache = new Map() // "<job>/<n>" -> verdicts of a finished round
let openJobId = null
let openPath = null
let openText = null

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw Object.assign(new Error(`${url}: HTTP ${res.status}`), { status: res.status })
  return res.text()
}

async function fetchFirst(url) {
  try { return (await fetchText(url)).split('\n')[0].trim() } catch { return null }
}

// ---- Board ---------------------------------------------------------------

function verdictOf(line) {
  if (line === null) return 'pending'
  const m = line.match(/^(?:VERDICT|GATE):\s*(PASS|CHANGES|FAIL)$/)
  return m ? m[1] : 'invalid'
}

// A round's verdicts come from its files: the gate first, then each routed reviewer.
async function roundVerdicts(job, n) {
  const key = `${job.id}/${n}`
  if (roundCache.has(key)) return roundCache.get(key)
  const dir = `jobs/${job.id}/round-${n}/`
  const v = { gate: verdictOf(await fetchFirst(dir + 'checks.md')), reviews: {} }
  if (v.gate === 'PASS') {
    await Promise.all(Object.keys(job.agents?.reviewers || {}).map(async (r) => {
      v.reviews[r] = verdictOf(await fetchFirst(`${dir}review-${r}.md`))
    }))
  }
  const settled = v.gate === 'FAIL' || (v.gate === 'PASS' && Object.values(v.reviews).every((x) => x === 'PASS' || x === 'CHANGES'))
  if (settled && n < job.round) roundCache.set(key, v)
  return v
}

function chip(label, v, waiting, title, extra = '', model = '') {
  const cls = ['PASS', 'CHANGES', 'FAIL'].includes(v) ? v : v === 'pending' ? (waiting ? 'wait' : '') : 'bad'
  const on = model ? ` (${esc(model)})` : ''
  return `<span class="chip ${extra} ${cls}" title="${esc(title)}${on}: ${esc(v)}">${esc(label)}${model ? `<small>${esc(model)}</small>` : ''}</span>`
}

function roundRow(job, n, v) {
  const current = n === job.round
  const cells = [chip('gate', v.gate, current && job.stage === 'gate', 'gate', 'gate')]
  if (v.gate === 'PASS') {
    for (const r of Object.keys(job.agents.reviewers)) {
      cells.push(chip(SHORT[r] || r, v.reviews[r], current && job.stage === 'review', r, '', job.agents.reviewers[r] || ''))
    }
  }
  return `<div class="round"><span class="r">R${n}</span><span class="cells">${cells.join('')}</span></div>`
}

function elapsed(job) {
  const end = job.ended ? new Date(job.ended) : new Date()
  const min = Math.max(0, Math.floor((end - new Date(job.started)) / 60000))
  return min >= 60 ? `${Math.floor(min / 60)}h${String(min % 60).padStart(2, '0')}m` : `${min}m`
}

// The example jobs keep their issue numbers but have no URLs.
const link = (url, text) =>
  url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : `<span>${text}</span>`

function links(job) {
  const out = [link(job.issue_url, `issue #${esc(String(job.issue))}`)]
  // Show the commit that landed on the base.
  if (job.merged_sha) out.push(`<span title="merged at ${esc(job.merged_sha)}">merged ${esc(job.merged_sha.slice(0, 7))}</span>`)
  return out.join('')
}

// How long since the scripts last touched the job. A long quiet stretch on a
// running job usually means its agent is still working, or has died.
function quiet(job) {
  if (!job.updated) return ''
  const min = Math.floor((Date.now() - new Date(job.updated)) / 60000)
  return min >= 10 ? `<span title="no script has touched this job for ${min} minutes">quiet ${min}m</span>` : ''
}

// "+" marks a cost that leaves out tokens of a model with no price in config.json.
const cost = (job) => `$${Number(job.cost_usd).toFixed(2)}${job.cost_incomplete ? '+' : ''}`

function card(job, rounds) {
  const live = LIVE.has(job.stage)
  const human = job.stage === 'needs-human'
  const done = job.stage === 'merged' || job.stage === 'rejected'
  const [num, ...slug] = job.id.split('-')
  const flag = human ? '<span class="flag">your call</span>'
    : job.stage === 'needs-info' ? '<span class="flag wait">asked author</span>'
    : job.stage === 'rejected' ? '<span class="flag wait">rejected</span>' : ''
  const risk = job.intake?.risk
  const meta = [
    risk ? `<span class="risk-${esc(risk)}">${esc(risk)}</span>` : '',
    `<span${job.cost_incomplete ? ` title="no price for ${esc(job.cost_incomplete.join(', '))}"` : ''}>${cost(job)}</span>`,
    `<span>${elapsed(job)}</span>`,
    live ? quiet(job) : '',
  ].join('')
  return `
    <article class="card ${live ? 'live' : ''} ${human ? 'human' : ''} ${done ? 'done' : ''} ${job.stage}"
             data-job="${esc(job.id)}" tabindex="0">
      <div class="card-top">
        ${live ? '<span class="pulse" aria-label="running"></span>' : ''}
        <span class="num">${esc(num)} · ${esc(slug.join('-'))}</span>
        ${flag}
      </div>
      <p class="feature">${esc(job.title)}</p>
      <div class="links">${links(job)}</div>
      ${rounds.length ? `<div class="rounds">${rounds.join('')}</div>` : ''}
      <div class="meta">${meta}</div>
      ${human ? `<div class="hint">${job.merge_failed ? 'the merge failed' : 'your decision'}: open this card for the commands</div>` : ''}
    </article>`
}

// ---- Summary -------------------------------------------------------------

const FINISHED = new Set(['merged', 'rejected'])
const WITH_PERSON = new Set(['needs-info', 'needs-human'])
const STATIONS = ['intake', 'spec', 'build', 'gate', 'review', 'approve', 'merging']
const stageCache = new Map() // job id -> ms per stage, once the job is finished
let lastSummary = ''
let previous = { at: 0, value: null }

// Time spent in each stage, from the job's event log. Older jobs have no log.
async function stageTimes(job) {
  if (stageCache.has(job.id)) return stageCache.get(job.id)
  let text
  try { text = await fetchText(`jobs/${job.id}/events.jsonl`) } catch {
    stageCache.set(job.id, null) // a job from before the event log existed: don't ask again
    return null
  }
  const out = {}
  let prev = new Date(job.started)
  for (const line of text.split('\n')) {
    let e
    try { e = JSON.parse(line) } catch { continue }
    if (e.event !== 'advance' || !e.from || !e.at) continue
    const at = new Date(e.at)
    out[e.from] = (out[e.from] || 0) + Math.max(0, at - prev)
    prev = at
  }
  if (FINISHED.has(job.stage)) stageCache.set(job.id, out)
  return out
}

async function subdirs(url) {
  const doc = new DOMParser().parseFromString(await fetchText(url), 'text/html')
  return [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('/')).map((h) => h.slice(0, -1)).sort()
}

// The run that `fx reset --keep` saved last, for comparison. Looked up twice a minute.
async function previousRun() {
  if (Date.now() - previous.at < 30000) return previous.value
  previous = { at: Date.now(), value: null }
  try {
    const name = (await subdirs('runs/')).at(-1)
    if (name) {
      const ids = await subdirs(`runs/${name}/`)
      const saved = await Promise.all(ids.map(async (id) => JSON.parse(await fetchText(`runs/${name}/${id}/job.json`))))
      previous.value = { name, totals: summarise(saved.map((job) => ({ job, rounds: [], stages: null }))) }
    }
  } catch { /* no saved runs */ }
  return previous.value
}

function summarise(stats) {
  const all = stats.map((s) => s.job)
  const merged = all.filter((j) => j.stage === 'merged')
  const t = {
    jobs: all.length, merged: merged.length,
    rejected: all.filter((j) => j.stage === 'rejected').length,
    waiting: all.filter((j) => WITH_PERSON.has(j.stage)).length,
    running: all.filter((j) => LIVE.has(j.stage)).length,
    cost: all.reduce((sum, j) => sum + Number(j.cost_usd || 0), 0),
    incomplete: all.some((j) => j.cost_incomplete),
    firstTry: merged.filter((j) => j.round === 1).length,
    minutes: merged.length ? merged.reduce((sum, j) => sum + (new Date(j.ended) - new Date(j.started)), 0) / merged.length / 60000 : null,
    rounds: 0, gateFails: 0, reviewers: {}, stages: {}, failures: {},
  }
  // job.json `failures`: factory/bin/job sync counts them from every round (factory/bin/labels.py).
  for (const j of all) {
    for (const [label, n] of Object.entries(j.failures || {})) t.failures[label] = (t.failures[label] || 0) + n
  }
  for (const s of stats) {
    for (const v of s.rounds) {
      if (v.gate === 'PASS' || v.gate === 'FAIL') t.rounds++
      if (v.gate === 'FAIL') t.gateFails++
      for (const [r, verdict] of Object.entries(v.reviews)) {
        if (verdict !== 'PASS' && verdict !== 'CHANGES') continue
        t.reviewers[r] = t.reviewers[r] || { asked: 0, changes: 0 }
        t.reviewers[r].asked++
        if (verdict === 'CHANGES') t.reviewers[r].changes++
      }
    }
    for (const [stage, ms] of Object.entries(s.stages || {})) t.stages[stage] = (t.stages[stage] || 0) + ms
  }
  return t
}

// Round once, to whole minutes, so 119.6 reads 2h00m and never 1h60m.
const mins = (m) => { if (m === null) return '–'; if (m < 1) return '<1m'; const r = Math.round(m)
  return r >= 60 ? `${Math.floor(r / 60)}h${String(r % 60).padStart(2, '0')}m` : `${r}m` }
const usd = (n) => `$${n.toFixed(2)}`
const outcomes = (t) => [
  t.merged && `${t.merged} merged`, t.waiting && `${t.waiting} with a person`,
  t.rejected && `${t.rejected} rejected`, t.running && `${t.running} running`,
].filter(Boolean).join(', ') || 'none finished yet'

// Counts, never percentages: a handful of jobs is too few for a rate to mean anything.
function summaryHtml(t, prev) {
  if (!t.jobs) return ''
  const stat = (k, big, d) => `<div class="stat"><div class="k">${k}</div><b>${big}</b><div class="d">${d}</div></div>`
  const cells = [
    stat('requests', t.jobs, outcomes(t)),
    stat('cost, estimated', usd(t.cost) + (t.incomplete ? '+' : ''),
      t.merged ? `${usd(t.cost / t.merged)} per merged change, every job's cost counted` : 'nothing merged yet'),
    stat('request to merge', mins(t.minutes), t.merged ? `average of ${t.merged} merged` : 'nothing merged yet'),
    stat('merged at the first try', t.merged ? `${t.firstTry} of ${t.merged}` : '–', 'without a second round'),
    stat('gate failures', t.rounds ? `${t.gateFails} of ${t.rounds}` : '–', 'rounds stopped by the checks'),
  ]
  const rows = []
  const reviewers = Object.entries(t.reviewers)
  if (reviewers.length) {
    rows.push(`<div class="row"><span class="k">reviewers that asked for changes</span>${reviewers.map(([r, x]) =>
      `<span>${esc(SHORT[r] || r)} <b>${x.changes} of ${x.asked}</b></span>`).join('')}</div>`)
  }
  const failures = Object.entries(t.failures).sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0]))
  if (failures.length) {
    rows.push(`<div class="row" title="./fx retro says where a fix would go"><span class="k">why rounds went back</span>${
      failures.map(([label, n]) => `<span>${esc(label)} <b>${n}</b></span>`).join('')}</div>`)
  }
  const timed = STATIONS.filter((st) => t.stages[st])
  if (timed.length) {
    const person = [...WITH_PERSON].reduce((sum, st) => sum + (t.stages[st] || 0), 0)
    rows.push(`<div class="row"><span class="k">time by station</span>${timed.map((st) =>
      `<span>${st} <b>${mins(t.stages[st] / 60000)}</b></span>`).join('')}${
      person ? `<span>waiting for a person <b>${mins(person / 60000)}</b></span>` : ''}</div>`)
  }
  if (prev) {
    const p = prev.totals
    rows.push(`<div class="row"><span class="k">previous run ${esc(prev.name)}</span><span>${p.jobs} requests, ${outcomes(p)}</span>
      <span>cost <b>${usd(p.cost)}</b></span><span>request to merge <b>${mins(p.minutes)}</b></span>
      <span>first try <b>${p.merged ? `${p.firstTry} of ${p.merged}` : '–'}</b></span></div>`)
  }
  return cells.join('') + rows.join('')
}

async function render() {
  const problems = []
  const cards = new Map(COLUMNS.map((c) => [c, []]))
  const stats = []
  for (const job of jobs) {
    if (!STAGES.has(job.stage)) { problems.push(`Job ${job.id} has unknown stage "${job.stage}"`); continue }
    const rounds = [], verdicts = []
    for (let n = 1; n <= job.round; n++) {
      const v = await roundVerdicts(job, n)
      verdicts.push(v)
      rounds.push(roundRow(job, n, v))
    }
    stats.push({ job, rounds: verdicts, stages: await stageTimes(job) })
    cards.get(COLUMNS.find((c) => c.stages.includes(job.stage))).push(card(job, rounds))
  }
  const summary = summaryHtml(summarise(stats), await previousRun())
  if (summary !== lastSummary) {
    lastSummary = summary
    $('summary').innerHTML = summary
  }
  // Newest first within a column.
  const html = COLUMNS.map((c) => `
    <section class="col ${c.cls || ''}">
      <div class="col-head">
        <h2>${c.label}</h2><span class="who">${c.who}</span>
        <span class="count">${cards.get(c).length || ''}</span>
      </div>
      ${cards.get(c).reverse().join('') || '<div class="empty">—</div>'}
    </section>`).join('')
  const banner = problems.map((p) => `<div class="banner">${esc(p)}</div>`).join('')
  if (html + banner !== lastRender) {
    lastRender = html + banner
    $('board').innerHTML = html
    $('banner').innerHTML = banner
  }
  renderNeeds()
  const running = jobs.filter((j) => LIVE.has(j.stage)).length
  const cost = jobs.reduce((sum, j) => sum + Number(j.cost_usd), 0)
  $('totals').textContent = `${running} running · $${cost.toFixed(2)} API-equivalent`
}

async function poll() {
  const status = $('status')
  try {
    jobs = await loadJobs()
    await render()
    if (openJobId) await refreshDrawer()
    status.className = 'status'
    status.innerHTML = `<span class="dot"></span>jobs/ · ${new Date().toLocaleTimeString()}`
  } catch (err) {
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  }
}

// factory/bin/job writes each jobs/<id>/job.json.
async function loadJobs() {
  let listing
  try { listing = await fetchText('jobs/') } catch (err) {
    if (err.status === 404) return []  // no job yet: the folder appears with the first one
    throw new Error('the dashboard server is not answering. Start it again with ./fx up')
  }
  const doc = new DOMParser().parseFromString(listing, 'text/html')
  const ids = [...doc.querySelectorAll('a')]
    .map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('/'))
    .map((h) => h.slice(0, -1))
    .sort()
  // A folder whose job.json is missing or half-written is skipped for this poll, as
  // factory/bin/job skips it; one such folder must not stop the whole board.
  const loaded = await Promise.all(ids.map(async (id) => {
    try { return JSON.parse(await fetchText(`jobs/${id}/job.json`)) } catch (err) {
      if (err.status === undefined && !(err instanceof SyntaxError)) throw err  // the server went away
      return null
    }
  }))
  return loaded.filter(Boolean)
}

// ---- Drawer --------------------------------------------------------------

// python -m http.server serves an HTML index for directories; read its links.
async function listFiles(dir) {
  const doc = new DOMParser().parseFromString(await fetchText(dir), 'text/html')
  const hrefs = [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
  const out = []
  for (const h of hrefs) {
    if (h.endsWith('/')) out.push(...(await listFiles(dir + h)).map((f) => h + f))
    else if (h.endsWith('.md')) out.push(h)
  }
  return out
}

const ORDER = ['issue.md', 'intake.md', 'spec.md', 'build.md', 'decision.md', 'rejection.md']
const ROUND_ORDER = ['checks', 'review-code', 'review-security', 'review-ux', 'review-ui', 'merge-checks']

function fileRank(path) {
  if (ORDER.includes(path)) return [0, ORDER.indexOf(path), path]
  const round = path.match(/^round-(\d+)\/(.+)\.md$/)
  if (round) return [2, Number(round[1]) * 10 + ROUND_ORDER.indexOf(round[2]), path]
  return [1, 0, path] // intake-<k>.md, feedback-<k>.md
}

function sortFiles(files) {
  return files.sort((a, b) => {
    const [x, y] = [fileRank(a), fileRank(b)]
    return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
  })
}

function tone(first) {
  if (/^(VERDICT:\s*PASS|GATE:\s*PASS|APPROVE|STATUS:\s*READY|DECISION:\s*ACCEPT)$/.test(first)) return 'good'
  if (/^(VERDICT:\s*CHANGES|DECISION:\s*NEEDS-INFO)$/.test(first)) return 'warn'
  if (/^(ESCALATE|REJECTED|STATUS:\s*BLOCKED|GATE:\s*FAIL|DECISION:\s*REJECT)$/.test(first)) return 'stop'
  return null
}

const firstLines = new Map()

// The commands that decide a waiting job. The dashboard only reads files, so
// it shows what to type; the scripts do the work and check it.
function moves(job) {
  const id = job.id
  if (job.stage === 'needs-human') {
    const out = []
    if (job.merge_failed) out.push([`./fx retry ${id}`, 'The merge failed. Try it again; no new round is needed.'])
    else if (job.gated_sha) out.push([`./fx approve ${id}`, 'Approve it. The factory runs the checks again and merges.'])
    out.push([`./fx feedback ${id}`, 'Send it back to work. You write what should change.'])
    out.push([`./fx reject ${id}`, 'Drop it. Your reason is posted on the issue.'])
    const why = job.merge_failed ? 'The merge failed.'
      : job.gated_sha ? 'Waiting for your decision. Read decision.md below first.'
      : 'Waiting for you. It can\'t be approved as it is: no commit has passed the checks.'
    return { why, list: out }
  }
  if (job.stage === 'needs-info') {
    return { why: 'The factory asked the author a question. See intake.md below.', list: [
      [`factory/bin/job answer ${id}`, 'Answer it. Your words go on the issue (type them, then Ctrl-D).'],
      [`./fx reject ${id}`, 'Drop it. Your reason is posted on the issue.'],
    ] }
  }
  if (LIVE.has(job.stage)) {
    return { why: '', list: [[`./fx park ${id}`, 'Stop this job if it is stuck. It waits for you instead.']] }
  }
  return null
}

const moveHtml = ([cmd, what]) => `
    <div class="move">
      <code>${esc(cmd)}</code>
      <button class="copy" data-copy="${esc(cmd)}" aria-label="Copy the command ${esc(cmd)}">copy</button>
      <div class="what">${esc(what)}</div>
    </div>`

function movesHtml(job) {
  const m = moves(job)
  if (!m) return ''
  return (m.why ? `<div class="why">${esc(m.why)}</div>` : '') + m.list.map(moveHtml).join('')
}

// ---- Waiting for you ------------------------------------------------------

const TITLE = document.title
let lastNeeds = ''
let waitingBefore = null // ids that waited at the last poll; null until the first one

// Every job that waits on a person, with the first thing to type for it.
function renderNeeds() {
  const waiting = jobs.filter((j) => WITH_PERSON.has(j.stage))
  document.title = waiting.length ? `(${waiting.length}) ${TITLE}` : TITLE
  const html = waiting.length ? `<h2 id="needs-title">${waiting.length} waiting for you</h2><ul>${waiting.map((job) => {
    const [num] = job.id.split('-')
    const what = job.stage === 'needs-info' ? 'asked the author' : 'your call'
    return `<li><button class="job" data-job="${esc(job.id)}" aria-label="Open job ${esc(num)}, ${esc(job.title)}, ${what}">
        <span class="num">${esc(num)} · ${what}</span><span class="t">${esc(job.title)}</span></button>
      ${moveHtml(moves(job).list[0])}</li>`
  }).join('')}</ul>` : ''
  if (html !== lastNeeds) {  // don't rebuild under a copy button someone is about to click
    lastNeeds = html
    $('needs').innerHTML = html
    $('needs').hidden = !html
  }
  // Say so once when a job starts to wait, not on every poll.
  const ids = new Set(waiting.map((j) => j.id))
  if (waitingBefore) {
    const fresh = waiting.filter((j) => !waitingBefore.has(j.id))
    if (fresh.length) $('announce').textContent = fresh.map((j) => `Job ${j.id.split('-')[0]} is waiting for you: ${j.title}`).join('. ')
  }
  waitingBefore = ids
}

async function copyText(button) {
  const text = button.dataset.copy
  try {
    await navigator.clipboard.writeText(text)
    button.textContent = 'copied'
  } catch {
    // No clipboard access (an http page that isn't localhost): select the command instead.
    const range = document.createRange()
    range.selectNodeContents(button.previousElementSibling)
    const sel = getSelection()
    sel.removeAllRanges()
    sel.addRange(range)
    button.textContent = 'selected'
  }
  setTimeout(() => { button.textContent = 'copy' }, 1500)
}

async function refreshDrawer() {
  const job = jobs.find((j) => j.id === openJobId)
  if (!job) return
  $('d-num').textContent = `${job.id} · ${job.stage}${job.round ? ` · round ${job.round}` : ''} · ${cost(job)} · ${elapsed(job)}`
  $('d-title').textContent = job.title
  $('d-links').innerHTML = links(job)
  const m = movesHtml(job)
  if ($('d-moves').dataset.html !== m) {  // don't rebuild under a button someone is about to click
    $('d-moves').dataset.html = m
    $('d-moves').innerHTML = m
    $('d-moves').hidden = !m
  }

  const base = `jobs/${job.id}/`
  const files = sortFiles(await listFiles(base))
  if (!openPath || !files.includes(openPath)) openPath = files[0] || null

  let text = null
  if (openPath) {
    text = await fetchText(base + openPath)
    firstLines.set(base + openPath, text.split('\n')[0].trim())
  }
  // Every poll, not once: a verdict or status line can change while the drawer is open.
  await Promise.all(files.filter((f) => f !== openPath).map(async (f) => {
    const first = await fetchFirst(base + f)
    if (first !== null) firstLines.set(base + f, first)
  }))

  let group = null
  $('d-files').innerHTML = files.map((f) => {
    const g = f.includes('/') ? f.split('/')[0].replace('round-', 'Round ') : 'Job'
    const head = g !== group ? `<div class="group">${esc(g)}</div>` : ''
    group = g
    const round = f.match(/^round-(\d+)\//)
    const name = round
      ? `<span class="rn">R${round[1]} </span>${esc(f.split('/')[1].replace(/^review-|\.md$/g, ''))}`
      : esc(f)
    const t = tone(firstLines.get(base + f) || '')
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" data-file="${esc(f)}">
      <span class="v ${t || ''}"></span>${name}</button>`
  }).join('') || '<div class="empty">No files yet.</div>'

  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = text === null ? '<p class="note">Intake hasn’t written anything yet.</p>' : markdown(text)
  }
}

async function openDrawer(id) {
  openJobId = id
  // A waiting job opens on the file that says what it waits for.
  const stage = jobs.find((j) => j.id === id)?.stage
  openPath = stage === 'needs-human' ? 'decision.md' : stage === 'needs-info' ? 'intake.md' : null
  openText = undefined
  document.body.classList.add('open')
  try {
    await refreshDrawer()
  } catch (err) {
    $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>`
  }
}

function closeDrawer() {
  openJobId = null
  document.body.classList.remove('open')
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return
  const copyEl = e.target.closest('[data-copy]')
  if (copyEl) return copyText(copyEl)
  const cardEl = e.target.closest('[data-job]')
  if (cardEl) return openDrawer(cardEl.dataset.job)
  const fileEl = e.target.closest('[data-file]')
  if (fileEl) {
    openPath = fileEl.dataset.file
    openText = undefined
    $('d-doc').parentElement.scrollTop = 0
    return refreshDrawer()
  }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeDrawer()
  if (e.target.closest?.('a')) return  // Enter on a link follows the link
  const cardEl = e.target.closest?.('[data-job]')
  if (cardEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(cardEl.dataset.job) }
})

// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

// Every step's file has a `## Summary` of a few bullets; show it first, in a box.
function splitSummary(lines) {
  const start = lines.findIndex((l) => /^##\s+Summary\s*$/.test(l))
  if (start === -1) return { lines, summary: null }
  let end = start + 1
  while (end < lines.length && !/^#{1,2}\s/.test(lines[end])) end++
  return {
    lines: [...lines.slice(0, start), ...lines.slice(end)],
    summary: lines.slice(start + 1, end).join('\n'),
  }
}

function markdown(src) {
  const split = splitSummary(src.replace(/\r/g, '').split('\n'))
  const lines = split.lines
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) {
    html += `<div class="verdict ${t}">${esc(first)}</div>`
    i = 1
    // The rest of a KEY: value header block (intake.md, checks.md).
    const extra = []
    while (i < lines.length && /^[A-Z-]+:\s/.test(lines[i])) extra.push(lines[i++])
    if (extra.length) html += `<div class="head">${esc(extra.join('\n'))}</div>`
  }
  if (split.summary !== null) html += `<section class="summary"><h2>Summary</h2>${markdown(split.summary)}</section>`

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

poll()
setInterval(poll, POLL_MS)
</script>
</body>
</html>
