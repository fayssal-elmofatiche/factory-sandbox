# The project's checks and the factory's own tests, on Linux and on native Windows,
# with the oldest Python the project supports and a current one.
# WSL is Linux; macOS takes the same code paths as Linux and is not run here.
name: factory-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # Git Bash on Windows, as the factory uses it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # local-setup.sh pushes HEAD into a new origin; git refuses that from a shallow clone
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: python3 on Windows
        if: runner.os == 'Windows'
        # checks.sh and the agents' hooks call python3; some runner images have only python.exe.
        run: |
          dir="$(dirname "$(command -v python)")"
          [ -e "$dir/python3.exe" ] || cp "$dir/python.exe" "$dir/python3.exe"
          python3 --version
      - run: python3 -m pip install --group dev || python3 -m pip install "pytest>=8" "ruff>=0.6"  # --group needs pip 25.1
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: The project's checks
        run: bash factory/checks.sh
      - name: The factory's tests
        run: python3 -m pytest factory/tests -q
